# 로컬 Spark → 로컬 MinIO (s3a) 접속 설정.
#
# 이 파일이 컨테이너의 /opt/spark/conf/ 에 마운트되므로
# pyspark · spark-submit 이 자동으로 읽는다. 코드에 config 를 쓸 필요가 없다.
#
#   docker compose exec spark pyspark
#   >>> spark.read.parquet("s3a://pickage-raw/...")
#
# ── 버전 정합 (제일 중요) ──────────────────────────────────────
# hadoop-aws 는 Spark 가 내장한 Hadoop 버전과 **정확히 같아야** 한다.
# 하나라도 어긋나면 NoSuchMethodError 로 죽고 원인이 안 보인다.
#
#   이미지        apache/spark:3.5.3-python3
#   Spark         3.5.3 (Scala 2.12)
#   내장 Hadoop   3.3.4   ← /opt/spark/jars/hadoop-client-api-3.3.4.jar 로 확인
#   따라서        hadoop-aws:3.3.4
#
# 이미지 태그를 올리면 이 줄도 같이 확인할 것. 확인 방법:
#   docker run --rm <이미지> ls /opt/spark/jars | grep hadoop-client-api
#
spark.jars.packages                           org.apache.hadoop:hadoop-aws:3.3.4

# 내려받은 JAR 캐시 위치. 볼륨으로 잡아 둬서 매번 다시 받지 않는다.
spark.jars.ivy                                /opt/work/.ivy2

# ── MinIO 접속 ────────────────────────────────────────────────
# compose 네트워크 안이므로 호스트명은 서비스 이름(minio)이다.
spark.hadoop.fs.s3a.endpoint                  http://minio:9000

# 자격증명은 여기 적지 않는다. spark-env.sh 가 pipeline/minio/.env 의 값을
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 로 내보내고, 아래 provider 가 그걸 읽는다.
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# path-style 필수. 기본값(virtual-host)은 http://버킷명.endpoint/ 로 붙어서
# MinIO 가 응답하지 않는다. boto3 의 addressing_style="path" 와 같은 이유.
spark.hadoop.fs.s3a.path.style.access         true

# 로컬 MinIO 는 http 다.
spark.hadoop.fs.s3a.connection.ssl.enabled    false
