# 로컬 리허설 전용 override — **커밋 대상이 아니다.**
#
#   docker compose -f compose.yaml -f rehearsal.override.yaml -p pickage-monitoring-rehearsal up -d
#
# 운영 파일을 그대로 쓰되, Linux 호스트 전제인 두 가지만 흉내 낸다.

services:
  netdata:
    # 운영은 network_mode: host 다. Docker Desktop 에서는 호스트가 Windows 가 아니라
    # 그 아래 Linux VM 이라 host 모드의 의미가 달라진다 — bridge 로 내리고 포트를 뚫는다.
    network_mode: bridge
    ports:
      # ⚠ 127.0.0.1 접두사를 지우지 말 것. 로컬에서는 **이 줄이 방어선이다.**
      #   운영에서는 host 모드라 ports: 가 없고, netdata.conf 의 bind to 가 그 역할을 한다.
      - "127.0.0.1:19999:19999"

    volumes:
      # bridge 안에서 127.0.0.1 에 묶으면 컨테이너 자기 loopback 에만 붙어서
      # 위 포트 매핑이 닿지 않는다. 그래서 리허설에서는 0.0.0.0 으로 둔 사본을 쓴다.
      # (같은 target 을 다시 적으면 compose 가 위쪽 마운트를 대체한다)
      - ./netdata.rehearsal.conf:/etc/netdata/netdata.conf:ro
      # 운영은 `/:/host/root:ro,rslave` 다. rslave 는 "이 뒤에 호스트에서 새로 마운트되는
      # 것도 따라 보이게" 하는 전파 옵션인데, Docker Desktop VM 의 `/` 는 shared/slave 가
      # 아니라서 거부당한다(`path / is mounted on / but it is not a shared or slave mount`).
      # 리허설에서만 뗀다.
      #
      # ⚠ 서버에서는 반대로 이게 먹는지 확인할 것:  findmnt -no PROPAGATION /
      - /:/host/root:ro
      # 위와 같은 이유로 rslave 를 뗀 사본.
      - /:/host/parent-distro:ro
