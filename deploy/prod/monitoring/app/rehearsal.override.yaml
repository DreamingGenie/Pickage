# 로컬 리허설 전용 override — **커밋 대상이 아니다.**
#
#   docker compose -f compose.yaml -f rehearsal.override.yaml -p pickage-monitoring-rehearsal up -d
#
# 운영 파일을 그대로 쓰되, Linux 호스트 전제인 두 가지만 흉내 낸다.

services:
  netdata:
    # 운영은 network_mode: host 다. Docker Desktop 에서는 호스트가 Windows 가 아니라
    # 그 아래 Linux VM 이라 host 모드의 의미가 달라진다 — bridge 로 내리고 포트를 뚫는다.
    network_mode: bridge
    ports:
      # ⚠ 127.0.0.1 접두사를 지우지 말 것. 로컬에서는 **이 줄이 방어선이다.**
      #   운영에서는 host 모드라 ports: 가 없고, netdata.conf 의 bind to 가 그 역할을 한다.
      - "127.0.0.1:19999:19999"

    volumes:
      # bridge 안에서 127.0.0.1 에 묶으면 컨테이너 자기 loopback 에만 붙어서
      # 위 포트 매핑이 닿지 않는다. 그래서 리허설에서는 0.0.0.0 으로 둔 사본을 쓴다.
      # (같은 target 을 다시 적으면 compose 가 위쪽 마운트를 대체한다)
      - ./netdata.rehearsal.conf:/etc/netdata/netdata.conf:ro
      # 운영은 `/:/host/root:ro,rslave` 다. rslave 는 "이 뒤에 호스트에서 새로 마운트되는
      # 것도 따라 보이게" 하는 전파 옵션인데, Docker Desktop VM 의 `/` 는 shared/slave 가
      # 아니라서 거부당한다(`path / is mounted on / but it is not a shared or slave mount`).
      # 리허설에서만 뗀다.
      #
      # ⚠ 서버에서는 반대로 이게 먹는지 확인할 것:  findmnt -no PROPAGATION /
      - /:/host/root:ro
      # 위와 같은 이유로 rslave 를 뗀 사본.
      - /:/host/parent-distro:ro

  # ── 11절 파이프라인 모니터 — 로컬 MinIO 를 상대로, 두 노드 흐름까지 ──────────
  # 운영은 host 모드에 listen 이 127.0.0.1 이다. 여기서는 netdata 와 같은 이유로 bridge 로
  # 내리고, 컨테이너 안에서 0.0.0.0 에 듣게 한 뒤 127.0.0.1:19998 로만 뚫는다.
  # MinIO 는 루트 compose 의 minio(`--profile data`, 127.0.0.1:9000)에 Docker Desktop 의
  # 호스트 이름으로 붙는다 — .env 의 MONITOR_S3_ENDPOINT=http://host.docker.internal:9000,
  # 키는 로컬 MinIO 루트 키를 그대로 써도 된다(내 PC 다). 소켓은 root:root 라 DOCKER_GID=0.
  pipeline-monitor:
    network_mode: bridge
    ports:
      - "127.0.0.1:19998:19998"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # data 노드 역할은 아래 두 번째 컨테이너가 한다. 운영 설정의 peers(사설 IP) 대신 그쪽을 본다 —
    # netdata 처럼 기본 bridge 라 compose 의 서비스 이름이 안 풀리므로, 호스트에 뚫은 19997 로 간다.
    command: ["--listen", "0.0.0.0:19998", "--peer", "data=http://host.docker.internal:19997"]

  # data 노드의 같은 서버를 흉내 낸다 — 같은 이미지, data 설정. 127.0.0.1:19997 로 뚫는다 —
  # 위 중계가 이 포트로 오고, 사람이 직접 볼 수도 있다(운영에서 data 노드에 직접 터널을 여는 것과 같다).
  # 로컬 경로(/host/srv/…)는 없으므로 그 절은 "missing" 으로 나온다 — 그게 맞다.
  pipeline-monitor-data:
    image: pickage-pipeline-monitor:runtime
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:19997:19998"
    hostname: rehearsal-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONITOR_CONFIG: /etc/pipeline-monitor.yaml
      PICKAGE_S3_ENDPOINT: ${MONITOR_S3_ENDPOINT}
      PICKAGE_S3_ACCESS_KEY: ${MONITOR_S3_ACCESS_KEY}
      PICKAGE_S3_SECRET_KEY: ${MONITOR_S3_SECRET_KEY}
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ../../../../pipeline:/opt/work/pipeline:ro
      - ../data/pipeline-monitor.yaml:/etc/pipeline-monitor.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--listen", "0.0.0.0:19998"]
    mem_limit: 256m
    memswap_limit: 256m
