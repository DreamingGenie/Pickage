# Pickage 모니터링 — `app` 노드 (j15a506) · **parent**
#
#   cd /srv/pickage/monitoring/deploy/prod/monitoring/app
#   docker compose up -d
#
# 계획과 단계별 확인 명령: ../README.md
#
# ⚠ 이것은 `app` 노드용이다. `data` 노드(j15a506**a**)는 ../data/ 다 — 뒤에 a 가 하나 붙는다.
#   붙기 전에 `hostname` 을 한 번 볼 것.

# ⚠ 운영 스택(pickage-app)과 **다른 프로젝트 이름**이다. 일부러 그렇다.
#   같은 이름이면 `docker compose down` 한 번에 운영 DB 까지 같이 내려간다.
name: pickage-monitoring-app

services:
  netdata:
    # ⚠ 태그를 고정한다. `stable`·`latest` 는 어느 날 조용히 바뀌고,
    #   그날 대시보드가 달라져도 무엇이 바뀐 건지 알 방법이 없다
    #   (../README.md 의 "하지 말 것" 에 있는 API_TAG=latest 와 같은 이유다).
    #   v2.10.1 = 2026-04-10 stable. 태그가 없으면 pull 이 **즉시 실패한다** — 조용히 틀리지 않는다.
    #   TODO Phase 1: 처음 pull 한 뒤 digest 를 받아 이 줄 옆에 적을 것
    #     docker images --digests netdata/netdata
    image: netdata/netdata:v2.10.1
    restart: unless-stopped

    # host 네트워크라 컨테이너 hostname 이 곧 대시보드에 찍히는 노드 이름이 된다.
    # 안 적으면 컨테이너 ID 가 노드 이름이 되어 **재생성할 때마다 다른 노드로 보인다.**
    hostname: j15a506-app

    # 왜 host 네트워크인가: 호스트의 네트워크 인터페이스를 그대로 봐야 한다.
    # bridge 로 두면 컨테이너의 veth 만 보이고 호스트 트래픽이 안 잡힌다.
    #
    # ⚠ 대가: `ports:` 로 바인딩을 제한할 수 없다. **어디에 붙을지는 netdata.conf 의
    #   `[web] bind to` 가 혼자 결정한다.** 그 줄이 이 스택의 유일한 방어선이다
    #   (같은 노드의 spark-worker-2 가 같은 이유로 host 모드다 — ../../README.md).
    network_mode: host

    # 프로세스별 CPU·RSS·I/O 를 보려면 호스트 PID 네임스페이스가 필요하다.
    # 없으면 컨테이너 단위까지만 보인다.
    pid: host

    cap_add:
      # /proc/<pid> 를 읽어 프로세스 이름을 푼다. 이것만 준다.
      - SYS_PTRACE
      # ⚠ SYS_ADMIN 은 주지 않는다. Netdata 공식 예시에는 있지만 그건 eBPF 수집기용이고,
      #   아래 netdata.conf 에서 ebpf 를 꺼 두었다. 이유는 ../README.md 4절.

    environment:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"

      # ⚠ 이걸 빼면 **컨테이너 이름이 안 보인다.** netdata 는 컨테이너 안에서
      #   netdata 사용자로 도는데, 호스트의 docker 그룹에 속하지 않으면 소켓을 못 연다.
      #   증상이 "권한 오류" 가 아니라 "이름 대신 cgroup ID 12자리" 라서 한참 헤맨다.
      #
      #   서버에서 값을 얻어 .env 에 넣는다:  getent group docker | cut -d: -f3
      PGID: ${DOCKER_GID:?.env 를 만들고 DOCKER_GID 를 채울 것 (cp .env.example .env)}

    volumes:
      # ── 설정은 저장소가 소유한다 ────────────────────────────────
      # /etc/netdata 를 볼륨으로 통째로 잡지 않는다. 그러면 서버에서 손으로 고친 것이
      # 볼륨에 남아 **저장소의 파일과 실제로 도는 설정이 갈린다.**
      # 이미지가 들고 있는 기본 설정을 쓰고, 우리가 정한 두 파일만 덮어쓴다.
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # stream.conf 는 API 키(공유 비밀)가 들어 있어 커밋되지 않는다.
      # cp stream.conf.example stream.conf 후 채운다 — 만드는 절차는 ../README.md Phase 4.
      - ./stream.conf:/etc/netdata/stream.conf:ro
      # "지금 어때" 한 장. netdata 의 웹 루트에 얹으면 **같은 포트로 같이 서빙된다** —
      # 팀원은 터널 하나 열고 /status.html 만 열면 된다. 각자 설정할 것이 없다.
      # 왜 커스텀 대시보드가 아니라 이 방식인지는 ../README.md 8절.
      - ./status.html:/usr/share/netdata/web/status.html:ro

      # ── 메트릭 DB·캐시 ─────────────────────────────────────────
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata

      # ── 호스트 관측 (전부 읽기 전용) ────────────────────────────
      # rslave: 이 뒤에 호스트에서 새로 마운트되는 것도 따라 보인다.
      # 없으면 나중에 붙인 디스크가 df 에서 빠진다.
      - /:/host/root:ro,rslave
      # ⚠ **같은 `/` 를 한 번 더 붙인다. 이 줄을 빼면 컨테이너별 메트릭이 통째로 안 나온다.**
      #
      #   netdata 2.10.1 은 cgroup 루트를 `<host access prefix>/parent-distro/sys/fs/cgroup`
      #   에서 찾는다. `/sys` 를 아무리 붙여도 이 경로가 없으면 그냥 포기한다:
      #     CGROUP: cannot open directory '/host/parent-distro/sys/fs/cgroup'
      #     CGROUP: disabled unified cgroups statistics.
      #
      #   컨테이너는 healthy 로 뜨고 CPU·메모리·디스크 차트도 멀쩡히 나온다.
      #   **없어지는 것은 컨테이너별 자원과 이름뿐**이라 한참 모르고 지나간다.
      #   2026-09-16 로컬 리허설에서 실제로 밟았다. 공식 compose 예시에도 이 줄이 없고,
      #   기본 설정 그대로 띄워도 똑같이 실패하는 것을 확인했다.
      #
      #   판정: curl -s 'http://127.0.0.1:19999/api/v3/contexts' | grep -c cgroup   → 0 이면 이 줄이다
      - /:/host/parent-distro:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      # uid·gid 를 사람이 읽는 이름으로 바꾼다. 없으면 프로세스 소유자가 숫자로 나온다.
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      # 이게 없으면 차트의 시각이 UTC 라 배치 시각과 대조할 때마다 9시간을 암산하게 된다.
      - /etc/localtime:/etc/localtime:ro

      # ⚠ **소켓을 주는 것은 호스트 root 를 주는 것과 같다.** `:ro` 는 소켓 *파일*의
      #   권한일 뿐이고, 그 소켓으로 말하는 Docker API 에는 읽기/쓰기 구분이 없다.
      #   그래도 직접 주기로 한 근거와, 다시 볼 조건(= 대시보드를 밖에 여는 날)은
      #   ../README.md 4절에 있다.
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # systemd unit 상태(Phase 5, 배치 스케줄러가 정해진 뒤). 지금은 쓰지 않지만
      # 마운트는 공짜고, 나중에 붙일 때 컨테이너를 다시 만들지 않아도 된다.
      - /run/dbus:/run/dbus:ro

    # ⚠ 짝으로 둔다. memswap_limit 을 빼면 Docker 가 총량을 mem_limit 의 **2배**로 잡아서
    #   512m 짜리 상한이 조용히 1g 가 된다. 이유는 ../../README.md 의 "Swap".
    #
    #   모니터링에 스왑을 안 주는 이유: 스왑으로 밀린 모니터링은 죽지 않고 **느려진다.**
    #   그러면 정작 서버가 아픈 순간에 차트가 비거나 멈춘다 — 가장 필요할 때 못 쓴다.
    #   차라리 깨끗하게 OOM 나고 restart 로 돌아오는 쪽이 낫다.
    #
    # TODO Phase 4: parent 가 두 노드치를 보관하게 되면 다시 잰다.
    #   docker stats --no-stream pickage-monitoring-app-netdata-1
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  netdatalib:
  netdatacache:
