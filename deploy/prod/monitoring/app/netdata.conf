# `app` 노드(j15a506) parent 설정.
#
# 이미지가 들고 있는 기본 netdata.conf 를 통째로 덮어쓴다. 여기 없는 값은 전부 기본값이다.
# **적어 둔 것은 기본값과 달라야 하는 것뿐이다.**
#
# ⚠ 설정 키 이름은 Netdata 버전마다 바뀐 이력이 있고, **모르는 키는 조용히 무시된다.**
#   그래서 "적었으니 됐다" 가 성립하지 않는다. 실제로 먹은 값은 이것으로 확인한다:
#
#     curl -s http://127.0.0.1:19999/netdata.conf | grep -A12 '^\[db\]'
#
#   아래 retention 값이 그대로 보이면 먹은 것이다. 다른 숫자(1GiB 등)면 키 이름이
#   이 버전과 안 맞는 것이니 위 출력에 나온 이름으로 고친다.

[global]
    # 대시보드·스트리밍에 찍히는 이름. compose 의 hostname 과 같게 둔다.
    hostname = j15a506-app

[db]
    db = dbengine

    # ⚠ 기본은 1초다. **이 노드는 물리 2코어(4 vCPU)** 고, 그걸 사용자 트래픽·api·postgres 가
    #   이미 나눠 쓴다. 2초로 두면 수집 비용이 대략 절반이 되고, 우리가 보려는 것
    #   (배치 중 메모리, 디스크 여유, 컨테이너 재시작)에 1초 해상도는 필요 없다.
    update every = 2

    # ⚠ 기본값은 tier 당 1GiB, 합 3GiB 다. 이 노드의 `/` 는 DB·백업·도커가 같이 쓰는
    #   파티션 하나뿐이고 **2026-09-18 실측 61%(309G 중 188G)** 다 — 모니터링이 디스크를 먹어 DB 를
    #   멈추게 하는 일만은 없어야 한다. 합 448MiB 로 묶는다.
    #
    #   size 와 time 중 **먼저 걸리는 쪽**이 적용된다.
    #   v1.99.0 이하는 키 이름이 `dbengine tier N disk space MB` 다 (위 확인 명령 참고).
    dbengine tier 0 retention size = 256MiB
    dbengine tier 0 retention time = 2d
    dbengine tier 1 retention size = 128MiB
    dbengine tier 1 retention time = 14d
    dbengine tier 2 retention size = 64MiB
    dbengine tier 2 retention time = 90d

[plugin:proc:diskspace]
    # ⚠ compose 에서 `/` 를 **두 군데**(`/host/root` 와 `/host/parent-distro`) 마운트한다.
    #   cgroup 수집기가 후자를 요구하기 때문인데(compose.yaml 의 그 줄 주석), 그 대가로
    #   **모든 마운트 지점이 디스크 차트에 두 번 나온다.** "어느 디스크가 찼나" 를
    #   봐야 하는 순간에 같은 값이 두 벌이면 그것부터 헷갈린다.
    #
    #   그래서 사본 쪽만 통째로 뺀다. 기본값 목록을 지우지 않고 뒤에 이어 붙인다 —
    #   앞의 것들(/proc/* /sys/* /var/lib/docker/* …)은 netdata 기본값이고 필요하다.
    #
    #   확인:  curl -s http://127.0.0.1:19999/api/v1/charts | grep -c 'disk_space./parent-distro'
    #          → 0 이어야 한다
    exclude space metrics on paths = /dev /dev/shm /proc/* /sys/* /var/run/user/* /run/lock /run/user/* /snap/* /var/lib/docker/* /var/lib/containers/storage/* /run/credentials/* /run/containerd/* /rpool /rpool/* /parent-distro /parent-distro/*

[web]
    # ⚠⚠ **이 스택에서 제일 중요한 한 줄이다.**
    #
    #   network_mode: host 라 compose 의 `ports:` 로는 아무것도 못 막는다.
    #   여기에 `0.0.0.0` 이나 `*` 를 적으면 **로그인 없는 대시보드가 인터넷에 열린다** —
    #   이 노드는 인터넷에 노출된 유일한 노드다. 컨테이너 이름·프로세스 목록·디스크
    #   사용량이 그대로 공개된다.
    #
    #   확인:  ss -ltn | grep 19999
    #
    #   사람이 보는 것은 127.0.0.1 로만 한다 — SSH 터널을 쓴다 (../README.md 5절).
    #   172.26.6.235 는 이 노드의 **사설 IP** 이고, data 노드의 child 가 여기로 접속한다
    #   (../../README.md 의 노드 표). VPC 밖에서는 이 주소로 못 닿고, 실제 문은
    #   보안그룹의 인바운드 19999(출처 172.26.8.249) 한 줄이다.
    #
    # ⚠ **이 줄을 서버에서 손으로 고치지 말 것.** 추적되는 파일이라 다음 git pull 이
    #   충돌한다. 고칠 일이 있으면 저장소에서 고치고 서버는 pull 만 한다.
    #   서버에서 만드는 파일은 .env 와 stream.conf 둘뿐이다(둘 다 커밋되지 않는다).
    bind to = 127.0.0.1:19999 172.26.6.235:19999

[ml]
    # 이상탐지(anomaly). 코어가 넉넉하지 않고, 여기서 보려는 것은 "값이 이상한가" 가 아니라
    # "디스크가 차는가·컨테이너가 죽었는가" 다. 차트도 줄어든다.
    enabled = no

[plugins]
    # 물리 2코어(4 vCPU)다. 지금 보려는 것에 안 쓰는 수집기는 끈다.
    #
    # ebpf: syscall 수준 추적. 이걸 켜려면 cap_add 에 SYS_ADMIN 이 필요한데
    #       그 권한을 주지 않기로 했다 (../README.md 4절). 켜 봐야 붙지도 않는다.
    ebpf = no
    # perf: 하드웨어 성능 카운터. 가상 머신이라 대개 값이 안 나오고 CPU 만 쓴다.
    perf = no
    slabinfo = no
    # python.d: 우리가 쓰는 수집기는 전부 go.d 쪽에 있다. 파이썬 런타임만 메모리를 먹는다.
    python.d = no
    # 안 쓰는 것들. 트래픽 셰이핑(tc)을 건 적이 없고, OpenTelemetry 도 받지 않으며,
    # charts.d 는 go.d 로 대체된 레거시다. **이건 CPU·표면을 줄이는 것이지
    # 대시보드 트리를 줄이는 게 아니다** — 아래 주의를 볼 것.
    tc = no
    charts.d = no
    debugfs = no
    otel = no
    otel-signal-viewer = no
    #
    # ⚠ 아래 넷은 **끄지 않는다.** 나중에 필요해진다:
    #   systemd-units (Phase 5 배치 상태) · systemd-journal (로그) ·
    #   network-viewer (Live 탭) · go.d (Postgres·nginx 수집기가 여기 있다)

# ⚠ **"안 쓰는 수집기를 꺼서 화면을 줄이자" 는 통하지 않는다. 재 봤다.**
#
#   netdata 는 **있는 것만 차트를 만든다.** ZFS·btrfs·InfiniBand·무선랜 같은 것은
#   애초에 차트가 없어서, `[plugin:proc]` 에서 꺼도 **컨텍스트 수가 259 → 259 였다**
#   (2026-09-16 로컬 리허설). 죽은 설정만 남으므로 그 목록은 넣지 않는다.
#
#   실제로 줄일 수 있는 것은 `user`·`usergroup`(28) 과 `netdata` 자기 모니터링(17)
#   정도이고, 그래 봐야 17% 다. 처음 보는 사람이 헤매는 문제는 이걸로 안 풀린다 —
#   그래서 "지금 어때" 한 장(`status.html`)을 따로 두는 쪽으로 갔다. ../README.md 8절.

[plugin:ioping]
    # 서버에서 이 플러그인이 설정 없이 죽으면서 로그에 오류를 남긴다(2026-09-18 확인).
    # 쓰지 않으므로 아예 끈다 — 로그가 깨끗해야 진짜 오류가 눈에 띈다.
    update every = 0

[statsd]
    # 애플리케이션이 메트릭을 밀어 넣는 입구다. 쓰지 않으면서 포트만 열어 둘 이유가 없다.
    enabled = no
