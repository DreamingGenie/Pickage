# Pickage 모니터링 — `data` 노드 (j15a506**a**) · **child**
#
#   cd ~/S15P21A506/deploy/prod/monitoring/data
#   docker compose up -d
#
# 계획과 단계별 확인 명령: ../README.md
#
# ⚠ 호스트명이 `app` 노드와 한 글자 차이다. 붙기 전에 `hostname` 을 볼 것.
#   여기는 minio · mlflow · spark master·worker① 이 도는 노드다.

# ⚠ 운영 스택(pickage-data)과 **다른 프로젝트 이름**이다. 같은 이름이면
#   `docker compose down` 한 번에 MinIO 까지 같이 내려간다 — 수집 원본이 그 안에 있다.
name: pickage-monitoring-data

services:
  netdata:
    # `app` 과 **같은 버전을 쓴다.** 스트리밍 프로토콜은 버전이 벌어지면 붙지 않을 수 있고,
    # 무엇보다 두 노드의 차트가 달라지면 한 화면에 놓고 비교하는 의미가 없어진다.
    image: netdata/netdata:v2.10.1@sha256:7f62a1bee44692aa31fc50c81fdb319836227e5fca2fdbcc7cbe65ce356eb17e
    restart: unless-stopped

    hostname: j15a506a-data

    # host 네트워크인 이유는 ../app/compose.yaml 과 같다.
    # 이 노드에는 spark-master·spark-worker-1 도 host 모드로 떠 있다 —
    # 포트는 안 겹친다(7077 · 8080 · 8081 · 40001-40014 vs 19999).
    network_mode: host
    pid: host

    cap_add:
      - SYS_PTRACE

    # ⚠ **배치 상태(6절)를 보려면 이것이 필요하다.** 없으면 systemd 유닛이 하나도 안 보인다.
    #
    #   이 노드에 pickage-weekly.timer 가 있고, netdata 가 그 상태를 읽으려면
    #   /run/dbus/system_bus_socket 으로 시스템 버스에 붙어야 한다. 소켓은 마운트돼
    #   있고 권한도 srw-rw-rw- 인데(확인함), **AppArmor 의 docker-default 프로파일이
    #   그 연결을 끊는다**:
    #
    #     SYSTEMD DBUS: Failed to add signal match for shutdown:
    #                   Transport endpoint is not connected
    #
    #   2026-09-18 서버에서 이 줄만 넣었다 빼며 확인했다 — 넣으면
    #   systemd.service_unit_state 가 나오고, 빼면 사라진다. 이 호스트는 AppArmor 가
    #   enforce 모드로 29개 프로파일을 돌리고 있다.
    #
    # ⚠ **공짜가 아니다.** docker-default 프로파일이 주던 추가 구속이 사라진다.
    #   이 컨테이너는 이미 pid: host · SYS_PTRACE · docker.sock · / 읽기 마운트를 갖고
    #   있어서 AppArmor 가 막아 주던 여지가 크지는 않지만, 넓어지는 것은 맞다.
    #
    #   더 좁히려면 docker-default 에 dbus 접근만 더한 **커스텀 프로파일**을 두 호스트에
    #   설치하는 방법이 있다. 프로파일이 없으면 컨테이너가 아예 안 뜨므로 관리 대상이
    #   하나 느는데, 3주 프로젝트에서 그 값을 치를 이유가 없다고 봤다.
    #
    # ⚠ **`app` 노드에는 넣지 않았다.** 거기엔 pickage 유닛이 없고, 그 노드는
    #   인터넷에 노출된 유일한 노드라 더 좁게 둔다. 대신 `app` 의 systemd 유닛
    #   (docker.service 등)은 모니터링되지 않는다 — 필요해지면 그때 같은 줄을 넣는다.
    security_opt:
      - apparmor:unconfined

    environment:
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      # 없으면 컨테이너 이름이 안 보인다. ../app/.env.example 의 설명 참고.
      PGID: ${DOCKER_GID:?.env 를 만들고 DOCKER_GID 를 채울 것 (cp .env.example .env)}

    volumes:
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # ⚠ child 쪽 stream.conf 는 **없으면 스트리밍이 그냥 안 된다.** 컨테이너는
      #   멀쩡히 뜨고 자기 대시보드도 나오는데 parent 화면에 이 노드만 안 나타난다.
      - ./stream.conf:/etc/netdata/stream.conf:ro
      # 배치 타이머를 보려면 필요하다. 없으면 수집기가 *.service 만 읽어서
      # **"타이머가 꺼져 있다" 를 영영 못 잡는다** — 그 파일의 주석을 볼 것.
      - ./systemdunits.conf:/etc/netdata/go.d/systemdunits.conf:ro

      # ⚠ netdatalib 볼륨은 ram 모드에서도 둔다. 메트릭 DB 말고도 이 노드의
      #   machine GUID 가 여기 산다 — 지우면 parent 가 **다른 노드로 인식해서**
      #   같은 서버가 이력 없는 새 노드로 한 번 더 생긴다.
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata

      - /:/host/root:ro,rslave
      # ⚠ **같은 `/` 를 한 번 더 붙인다. 빼면 컨테이너별 메트릭이 통째로 안 나온다.**
      #   이 노드에서는 minio·mlflow·spark 가 통째로 안 보인다는 뜻이다.
      #   이유와 판정 명령은 ../app/compose.yaml 의 같은 줄 주석에 있다.
      - /:/host/parent-distro:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro

    # ⚠ 짝으로 둔다 (../../README.md 의 "Swap").
    #
    #   `app` 보다 작게 잡는 근거: 이 노드는 child 라 dbengine 을 안 돌린다(ram 모드).
    #   그리고 **배치 시각에 이 노드가 가장 빠듯하다** — Spark 셋 12g + ai-similarity 2g
    #   ≈ 14g / 15Gi (../data/README.md). 모니터링이 그 계산을 흔들면 안 된다.
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  netdatalib:
  netdatacache:
