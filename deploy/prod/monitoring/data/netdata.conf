# `data` 노드(j15a506a) child 설정.
#
# parent 쪽(../app/netdata.conf)과 다른 점은 둘뿐이다 — **DB 를 안 쓴다**는 것과
# **사설 IP 에 바인딩하지 않는다**는 것. 나머지는 같은 이유로 같은 값이다.
#
# 실제로 먹은 값 확인 (이 노드에서):
#     curl -s http://127.0.0.1:19999/netdata.conf | grep -A6 '^\[db\]'

[global]
    hostname = j15a506a-data

[db]
    # ⚠ **디스크에 쓰지 않는다.** 이 노드의 `/` 는 MinIO 데이터·Docker·Spark 셔플이
    #   같이 쓰는 파티션이고, 스왑 파일을 거기 두는 것조차 IOPS 때문에 한 번 검토했던
    #   노드다 (../../README.md 의 "Swap"). 메트릭은 parent 가 보관한다.
    #
    #   대가: parent 가 오래 끊기면 그 구간이 사라진다. 짧은 끊김은 아래 메모리
    #   보존분으로 메워진다(replication). 감수하는 이유는 ../README.md Phase 4.
    db = ram

    # parent 와 같은 간격이어야 한 화면에서 두 노드를 나란히 놓을 수 있다.
    update every = 2

    # ram 모드의 보존량은 **메모리에 들고 있는 시간**이다. 기본값을 쓴다 —
    # parent 가 잠깐 끊겼다 돌아올 때 메울 분량이면 충분하고, 이 노드는
    # 배치 시각에 메모리가 가장 빠듯하다.
    # (retention 을 늘리려면 compose 의 mem_limit 256m 을 같이 본다)

[web]
    # ⚠ 사설 IP 에 바인딩하지 **않는다.** 이 노드는 parent 에게 **접속하는 쪽**이라
    #   밖에서 들어올 이유가 없다 — 열면 그만큼만 더 넓어진다.
    #
    #   127.0.0.1 을 남겨 두는 이유: parent 가 죽었을 때 이 노드에 직접 터널을 열어
    #   지금 상태만이라도 볼 수 있다. ram 모드라 이력은 없고 현재값만 나온다.
    #
    #     ssh -N -L 19998:127.0.0.1:19999 <계정>@j15a506a.p.ssafy.io
    #
    #   확인:  ss -ltn | grep 19999   → 127.0.0.1 한 줄만
    bind to = 127.0.0.1:19999

[plugins]
    # 근거는 ../app/netdata.conf 와 같다. 이 노드는 코어 수가 아직 실측 전이므로
    # (Phase 0) 일단 parent 와 같게 두고, 실측 뒤에 조정한다.
    ebpf = no
    perf = no
    slabinfo = no
    python.d = no

[health]
    # ⚠ 알람은 **parent 가 평가한다** (../app/stream.conf.example 의
    #   `health enabled by default = auto`). 여기서도 켜면 같은 알람이 두 번 뜬다.
    enabled = no

[statsd]
    enabled = no
