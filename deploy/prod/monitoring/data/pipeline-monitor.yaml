# 파이프라인 모니터 설정 — `data` 노드 (j15a506a).
#
# 커밋되는 파일이다. 자격증명은 여기 없다 (.env 의 MONITOR_S3_*).
# 키 목록과 기본값은 pipeline/monitor/config.py — 모르는 키를 적으면 시작하지 않는다.
#
# 이 노드가 **MinIO 목록과 주간 회차를 맡는다.** MinIO 가 같은 호스트라 LIST 가 호스트 안에서
# 끝나고, 주간 산출물·단계 로그도 이 노드 디스크에 있다. app 노드는 자기 컨테이너만 본다.
node: data

# 어디서 듣나. 0.0.0.0 을 쓰지 않는다 (netdata.conf 의 bind to 와 같은 태도).
#   127.0.0.1     이 노드에 직접 터널을 열었을 때 (app 이 죽었을 때의 우회로)
#   172.26.8.249  app 노드의 서버가 여기서 받아 화면에 중계한다. 이 노드의 사설 IP 다.
#                 문은 호스트 방화벽 한 줄 — ufw allow from 172.26.6.235 to any port 19998
#                 (deploy/prod/monitoring/README.md 11.3)
listen:
  - 127.0.0.1:19998
  - 172.26.8.249:19998

# 보고서 전체의 짧은 캐시. 탭 둘·연타를 한 번의 계산으로 합친다.
cache_seconds: 3

minio:
  # ── 두 층이다 ──────────────────────────────────────────────
  # events    버킷 이벤트 구독. 서버가 켜진 뒤 생긴 객체를 24시간 동안 메모리에 든다. 평소 화면은 이것만 본다.
  # inventory 전체 목록 조회. 화면의 "전체 목록 조회" 버튼을 눌렀을 때만 버킷을 통째로 나열한다
  #           (객체 1,000개당 요청 하나). 자동 갱신은 절대 긁지 않는다.
  events: true
  events_retention_hours: 24
  events_max: 20000
  inventory: true
  # 비우면 계정이 볼 수 있는 버킷 전부(pickage-raw · curated · vectors · mlflow-artifacts · quarantine).
  # 구독도 같은 목록에 건다.
  buckets: []
  # 경로 집계 깊이. `depsdev/v1/projects/snapshot=…/run_id=…/data/x.parquet` 에서 depth 3 은
  # `depsdev/v1/projects`, 4 는 snapshot 까지다. raw·curated 는 스냅샷·수집일 단위로 새 것이
  # 들어오므로 한 단계 더 편다. 그 아래(run_id·파일)는 `recent` 목록으로 보인다.
  depth: 3
  depth_overrides:
    pickage-raw: 4
    pickage-curated: 4
  # 넘기면 거기서 멈추고 truncated 를 켠다 — 화면에 "목록 잘림" 칩. 이 값은 compose.yaml 의 mem_limit(256m) 과
  # **짝**이다. 2026-09-22 tracemalloc 실측(실제 길이 키 110자, slots Obj): 객체당 262 B → 15만 개 피크 40 MiB.
  # 예산: 유휴 50 + 이벤트 버퍼 가득 24 + 목록 40 + 결과·응답 10 = 124 MiB, ×1.3 파편화 ≈ 165 MiB < 256m (여유 90).
  # 30만이면 피크 78 → 합 ≈ 210 MiB 로 여유 45 — 스왑 0(AGENTS.md 7절)이라 넘기면 truncated 가 켜지기 전에 OOM Kill 이다.
  # 올리려면 +10만 객체마다 +26 MiB 로 셈해 mem_limit 을 같이 올린다 (30만 = 384m). 2026-09 기준 raw 는 수만 객체 — 3배 여유.
  max_objects: 150000
  new_window_hours: 24
  recent_per_prefix: 20
  weekly: true
  weekly_bucket: pickage-raw
  weekly_max_runs: 8
  # raw → Curated 전처리 회차 (S15P21A506-372). 디스패처가 pickage-curated/_ops/preprocessing/<날짜>/status.json 에
  # 남기는 상태와 curated-bundle/_current.json 포인터, 실행기의 단계별 status.json 을 읽는다. 회차당 GET 2.
  curated: true
  curated_bucket: pickage-curated
  curated_max_runs: 8
  # `_current.json` 포인터들. 소비자가 지금 무엇을 읽는지가 여기 있다.
  #   코퍼스  → 유사도 배치의 입력 (deploy/prod/data/.env 의 AI_CORPUS_PREFIX)
  #   벡터    → app 노드 similarity-loader 가 보는 완료 포인터 (S15P21A506-371)
  pointers:
    - pickage-curated/ecosystems-keywords/v1/package-text/_current.json
    - pickage-vectors/_current.json

local:
  # 컨테이너 안 경로(compose 가 /host/… 로 마운트) 와 사람이 아는 호스트 경로.
  paths:
    - path: /host/srv/pickage/ingest-work
      label: /srv/pickage/ingest-work
  # 주간 회차의 단계별 로그. run.json 의 error_message 는 꼬리 4 KB 뿐이라 여기가 전문이다.
  log_globs:
    - /host/srv/pickage/ingest-work/downloads-weekly/*/logs/*.log
  tail_lines: 30
  max_logs: 12
  new_window_hours: 24
  max_new_files: 50
  # 단계 로그의 에러 줄 기준 — 컨테이너 로그와 따로 둔다 (성격이 다르다). 수집기 자신이 ERROR 를 찍은 것이라
  # 한 줄이라도 볼 일이다. 걸리지만 정상으로 아는 줄이 생기면 error_ignore_pattern 에 적는다.
  error_pattern: "(?i)\\b(error|exception|traceback|fatal|oom|killed|denied|refused)\\b|게시 실패|오류:|경고:"
  error_ignore_pattern: ""
  error_min_lines: 1

docker:
  enabled: true
  # 이 노드의 운영 스택(pickage-data-*)과 주간 수집 컨테이너(pickage-weekly-run).
  # 멈춘 것도 포함한다 — 종료 코드가 곧 정보다.
  # 모니터링 스택 자신(pickage-monitoring-*)은 뺀다 — netdata 기동 로그에 "error" 가 상시 섞여
  # 있어서(무해한 CLAIM·plugin 메시지) 넣으면 화면이 늘 노란불이 된다. 8.2 의 스왑 임계값과
  # 같은 이유다: 늘 노란 화면은 사람이 무시하게 만든다. 그 스택은 docker compose ps 로 본다.
  name_pattern: "^pickage-(?!monitoring-)"
  log_tail: 40
  log_since_hours: 6
  # 컨테이너 stdout 의 에러 줄 기준. 재기동 직후 spark-worker 가 MinIO 를 기다리며 남기는 "Connection refused"
  # 는 정상 동작인데 log_since_hours 동안 남는다 — 한 줄로 배너를 노랗게 만들지 않게 꼬리 40줄 중 3줄 이상일
  # 때만 판정에 올린다. 정상으로 아는 줄이 계속 걸리면 아래에 적어 세지 않게 한다.
  #   예: error_ignore_pattern: "(?i)connection refused.*(9000|5432)|waiting for"
  # 뒤의 한글은 우리 코드가 찍는 실패 문구("게시 실패" · "오류:" · "경고:")다. 맨 "실패" 는 넣지 않는다 —
  # 수집기 진행 줄("성공 3 · 실패 0")이 매번 걸린다.
  error_pattern: "(?i)\\b(error|exception|traceback|fatal|oom|killed|denied|refused)\\b|게시 실패|오류:|경고:"
  error_ignore_pattern: ""
  error_min_lines: 3
