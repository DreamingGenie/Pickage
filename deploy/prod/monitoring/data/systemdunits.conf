# netdata systemd-units 수집기 — **타이머까지 읽게 한다.**
#
# /etc/netdata/go.d/systemdunits.conf 로 마운트한다 (compose.yaml).
#
# ⚠ 이 파일이 없으면 수집기는 **`*.service` 만** 본다. 2026-09-18 서버에서 확인했다 —
#   `systemd.service_unit_state` 는 나오는데 `systemd.timer_unit_state` 가 아예 없었다.
#
#   그러면 **"타이머가 꺼져 있다" 를 영영 못 잡는다.** 서비스 실패는 10분 뒤 타이머가
#   다시 시도하지만, 타이머가 꺼지면 아무것도 안 돌고 아무 에러도 안 난다 —
#   이 리포가 cron 을 피한 이유가 정확히 그 침묵이다. 제일 위험한 실패를 놓치는 셈이다.
#
# 확인:
#   curl -s 'http://127.0.0.1:19999/api/v2/contexts' | grep -o '"systemd\.[a-z_]*"' | sort -u
#   → service_unit_state 와 timer_unit_state 가 **둘 다** 나와야 한다.
#     안 나오면 이 파일의 스키마가 이 버전과 안 맞는 것이다. 그때는
#     `docker compose logs netdata | grep -i systemdunits` 를 본다.

jobs:
  - name: units
    # 유닛 수가 많지 않은 서버라 넓게 잡아도 부담이 없다.
    # pickage-weekly 만 집어도 되지만, docker.service 나 certbot 타이머가 죽는 것도
    # 같이 보이는 편이 낫다 — netdata 기본 알람이 failed 유닛을 잡아 준다.
    include:
      - '*.service'
      - '*.timer'
