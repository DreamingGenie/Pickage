# 운영 nginx — `app` 노드 (j15a506.p.ssafy.io)
#
# 호스트에 설치된 nginx 를 끄고 이 컨테이너가 80/443 을 받는다.
#   sudo systemctl disable --now nginx
#
# 인증서는 호스트의 certbot 이 만든 것을 그대로 쓴다. /etc/letsencrypt 를 읽기 전용으로
# 통째로 마운트하므로 fullchain·privkey 뿐 아니라 certbot 이 만든
# options-ssl-nginx.conf 와 ssl-dhparams.pem 도 같이 들어온다.
#
# ⚠ 호스트 nginx 를 끄면 certbot 자동 갱신이 멈춘다. 이 프로젝트에서는 괜찮다 —
#   인증서 만료는 2026-11-30 이고 최종 발표는 2026-09-28 이다. 확인함.
#   프로젝트가 길어지면 갱신을 webroot 방식으로 바꿔야 한다.

server {
    listen 80;
    listen [::]:80;
    server_name j15a506.p.ssafy.io;

    # 컨테이너 healthcheck 가 두드리는 곳. 리다이렉트 없이 200 을 준다.
    # 아래 리다이렉트보다 먼저 매칭되도록 = (정확히 일치) 로 쓴다.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name j15a506.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15a506.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15a506.p.ssafy.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;

    # ── 업스트림 주소를 요청할 때마다 다시 푼다 ──────────────────
    #
    # ⚠ `proxy_pass http://api:8080;` 처럼 호스트명을 **리터럴로** 쓰면 nginx 는
    #   그 주소를 **설정을 읽을 때 한 번만** 푼다. 그러면 api 컨테이너를 재생성해
    #   IP 가 바뀌었을 때 nginx 가 **옛 IP 로 계속 보낸다.**
    #
    #   그게 우리 배포 경로에서 그대로 터진다 — 이미지 태그만 바뀌면
    #   `docker compose up -d` 는 api 만 재생성하고 web 은 그대로 둔다.
    #   증상은 이렇게 갈린다 (2026-09-09 로컬에서 재현함):
    #
    #     정적 /                 → 200   ← nginx 자체는 멀쩡
    #     /api · /actuator/health → 502 또는 504
    #     web 안에서 api 직접     → 정상  ← DNS 도 멀쩡
    #
    #   nginx 만 옛 주소를 쥐고 있어서, 헬스체크는 통과하는데 API 가 죽는다.
    #
    # 해결: proxy_pass 에 **변수**를 쓰면 nginx 가 기동 시점에 풀지 않고
    # 요청할 때 resolver 로 다시 푼다. 127.0.0.11 은 Docker 내장 DNS 다.
    # valid=10s 로 10초마다 갱신하므로 배포 후 최대 10초 안에 새 IP 를 잡는다.
    #
    # ipv6=off: 없으면 AAAA 조회를 먼저 시도해 매 요청에 지연이 붙는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    #
    # ⚠ 변수를 쓰면 nginx 가 location 접두사를 잘라내지 않고 원래 URI 를 그대로
    #   넘긴다. 우리는 경로를 자르지 않는 게 의도라 이게 맞다 —
    #   백엔드가 /api 로 시작하는 경로를 그대로 받는다.

    # 프록시 헤더는 server 단에 한 번만 쓴다. 아래 location 들이 물려받는다.
    #
    # X-Forwarded-Proto 가 핵심이다. 이게 없으면 스프링은 자기가 http 인 줄 알고
    # 리다이렉트와 Swagger 의 서버 주소를 http 로 만든다
    # (backend 의 application-prod.yaml 의 forward-headers-strategy 와 한 쌍이다).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # 기본값 1m 은 작다. 업로드가 없어도 큰 JSON 하나에 413 이 나면 원인을 한참 찾는다.
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── 백엔드로 넘기는 것 ────────────────────────────────────
    #
    # 프런트는 상대 경로 /api 를 부른다 (frontend/src/api/client.ts).
    # 경로를 고쳐 넘기지 않는다 — proxy_pass 끝에 / 를 붙이면 /api 가 잘려서
    # 브라우저가 보는 경로와 백엔드가 받는 경로가 달라지고, 그러면 로그·Swagger·
    # 에러 메시지가 전부 어긋난다.
    #
    # ⚠ 그래서 백엔드 컨트롤러는 /api 로 시작해야 한다. 예: @RequestMapping("/api/packages")
    location /api/ {
        proxy_pass $api_upstream;
    }

    # ⚠ 운영자 전용 API. 밖에서는 없는 것으로 보인다.
    #
    # 주간 수집 현황 조회와 **수동 실행 요청**이 여기 있다(S15P21A506-347). 그 POST 하나가
    # 23시간짜리 수집 잡을 켠다. 백엔드에 Spring Security 가 없어서 자바 쪽에 인증을 새로
    # 들이는 대신 문 앞에서 끊는다.
    #
    # 접두사가 더 길어서 위의 /api/ 보다 이 블록이 이긴다 (nginx 는 최장 일치다).
    # 순서와 무관하지만, 읽는 사람이 헷갈리지 않게 바로 아래에 둔다.
    #
    # 403 이 아니라 404 인 것이 의도다 — 403 은 "여기 뭔가 있다" 를 알려 준다.
    #
    # 운영자는 SSH 터널로 api 에 직접 붙는다:
    #   ssh -i ~/.ssh/J15A506T.pem -L 18080:localhost:8080 ubuntu@j15a506.p.ssafy.io
    #   curl -s localhost:18080/api/v1/ops/weekly/runs
    location /api/v1/ops/ {
        return 404;
    }

    location /swagger-ui/ {
        proxy_pass $api_upstream;
    }
    location = /swagger-ui.html {
        proxy_pass $api_upstream;
    }
    location /v3/api-docs {
        proxy_pass $api_upstream;
    }
    # 배포 스모크 테스트가 밖에서 두드리는 곳. show-details: never 라 {"status":"UP"} 만 나온다.
    location = /actuator/health {
        proxy_pass $api_upstream;
    }

    # ── 프런트 정적 파일 ──────────────────────────────────────
    #
    # Vite 가 파일 이름에 해시를 붙이므로 내용이 바뀌면 이름이 바뀐다. 오래 캐시해도 안전하다.
    location /assets/ {
        # expires 와 add_header 를 같이 쓰면 Cache-Control 이 두 줄로 나간다. 한 줄로 쓴다.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA. react-router 가 /analyze 같은 주소를 클라이언트에서 처리하는데,
    # 그 주소로 새로고침하면 nginx 가 파일을 찾다 404 를 낸다.
    # try_files 의 마지막 /index.html 이 그걸 막는다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
