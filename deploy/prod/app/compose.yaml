# Pickage 운영 — `app` 노드 (j15a506.p.ssafy.io)
#
#   cd deploy/prod/app
#   docker compose up -d
#
# 명령 모음과 배포·롤백 절차: deploy/prod/README.md
#
# ⚠ `data` 노드는 j15a506a 다 — 뒤에 a 가 하나 붙는다 (deploy/prod/data/).
#   붙기 전에 `hostname` 을 한 번 볼 것.

# 로컬은 pickage-local 이다. 이름이 환경을 드러내므로
# 운영 compose 를 실수로 로컬에서 띄우면 `docker ps` 에서 바로 보인다.
#
# ⚠ 이 이름을 바꾸면 볼륨 이름도 같이 바뀌어 운영 DB 가 통째로 고아가 된다.
name: pickage-app

services:
  postgres:
    # 로컬과 같은 메이저 버전. 로컬에서 되는 SQL 이 서버에서 안 되는 일을 막는다.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?.env 를 만들고 POSTGRES_DB 를 채울 것 (cp .env.example .env)}
      POSTGRES_USER: ${POSTGRES_USER:?.env 에 POSTGRES_USER 를 채울 것}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 채울 것 — openssl rand -base64 24}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 호스트에 포트를 열지 않는다 — `ports:` 가 없는 것이 의도다.
    # api 는 같은 compose 네트워크 안에서 postgres:5432 로 붙으므로 열 이유가 없고,
    # 127.0.0.1 로라도 열면 서버에 들어온 사람 누구나 붙을 수 있다.
    # psql 이 필요하면 컨테이너 안으로 들어간다 (README 참고).
    healthcheck:
      # 컨테이너 안의 셸이 풀어야 하는 변수라 $ 를 두 번 쓴다.
      # $POSTGRES_USER 라고 쓰면 compose 가 먼저 먹어 버린다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 2g
    # memswap_limit 을 mem_limit 과 **같게** 두는 것은 "이 컨테이너에 스왑을 0 준다" 는 뜻이다.
    # 이 줄을 빼면 Docker 가 총량을 mem_limit 의 2배로 잡아서, 호스트에 스왑이 생긴 뒤로는
    # **2g 짜리 상한이 조용히 4g 가 된다.** 이유와 확인 방법은 ../README.md 의 "Swap".
    #
    # postgres 에 스왑을 주지 않는 이유: shared_buffers 가 디스크로 밀리면 죽지 않고
    # **모든 쿼리가 같이 느려진다.** 사용자에게는 장애로 보이는데 컨테이너는 살아 있어서
    # `docker ps` 로도 OOM 기록으로도 안 잡힌다. 차라리 죽고 restart 로 돌아오는 게 낫다.
    memswap_limit: 2g

  api:
    # 로컬처럼 build: 만 두지 않는다. 운영에서 뜨는 것은 "지금 체크아웃된 소스" 가 아니라
    # "태그가 가리키는 이미지" 여야 한다. 그래야 롤백이 성립한다.
    #
    # build: 를 같이 둔 이유는 레지스트리가 없기 때문이다.
    # `docker compose build` 가 여기서 만든 이미지에 곧바로 이 태그를 붙인다.
    image: pickage-api:${API_TAG:?.env 에 API_TAG 를 채울 것 — 배포 job 이 커밋 SHA 로 갈아 끼운다}
    build:
      context: ../../../backend
    restart: unless-stopped
    depends_on:
      postgres:
        # "컨테이너가 떴다" 가 아니라 "DB 가 연결을 받는다" 를 기다린다.
        # 이게 없으면 첫 up 이 항상 실패한다.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 안에서 localhost 는 컨테이너 자신이다. 호스트가 아니다.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 컨테이너 상한의 몇 %를 힙으로 쓸지. 기본값이 25% 라 그냥 두면
      # 1.6g 중 400MB 만 힙으로 쓰고 나머지를 놀린다.
      # 100 으로 두지 않는 이유: 힙 밖에도 메타스페이스·스레드 스택·GC 구조가 있고,
      # 이 컨테이너에는 스왑을 0 주므로(memswap_limit) 상한을 넘기는 순간 즉시 OOM Kill 이다.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      # ⚠ 이 둘은 선택값이다 — `POSTGRES_*` 처럼 `:?` 로 막지 않는다. 없으면
      #   CommunityConfig 가 비인증 GitHub 호출로 폴백하고 CommunityReadiness 가
      #   false 로 떨어질 뿐, 컨테이너 기동을 막지 않는다(S15P21A506-363).
      #   값을 넣어도 GMS 요약 클라이언트(C1)가 없는 동안은 커뮤니티 기능이
      #   COMMUNITY_DISABLED 로 계속 거절된다 — 여기서는 배선만 한다.
      GITHUB_COMMUNITY_TOKEN: ${GITHUB_COMMUNITY_TOKEN:-}
      COMMUNITY_ENABLED: ${COMMUNITY_ENABLED:-false}
      # ⚠ GMS 요약 클라이언트(C1)는 아직 백엔드에 없다(FakeCommunitySummarizer만 존재) —
      #   지금은 이 다섯 값을 읽는 코드가 없으므로 사전 배선일 뿐이다. 이름은
      #   Pickage_GitHub커뮤니티_구현계획_260908.md §설정과 보안의 목표값을 그대로
      #   따른다 — 그 문서 스스로도 "실제로 존재한다고 주장하지 않는다"고 명시한 잠정값.
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-}
      GMS_REQUEST_PATH: ${GMS_REQUEST_PATH:-}
      GMS_AUTH_HEADER: ${GMS_AUTH_HEADER:-}
      GMS_AUTH_SCHEME: ${GMS_AUTH_SCHEME:-}
      GMS_MODEL: ${GMS_MODEL:-}
      # ── 주간 수집 운영 API (S15P21A506-347) ──
      #
      # ⚠ `POSTGRES_*` 와 달리 `:?` 가 아니라 `:-` 다. 모양은 비슷한데 의도가 반대다 —
      #   `:?` 는 값이 없으면 컨테이너 생성을 막고, `:-` 는 빈 값으로 넘긴다. 이건
      #   운영자 전용 도구라 **이 값 하나 때문에 사이트 전체가 안 뜨면 안 된다.**
      #   빈 값이 오면 ops API 만 "설정이 없습니다" 로 답하고 나머지는 평소대로 돈다.
      #
      # ⚠ **이름을 줄이지 말 것.** `application-prod.yaml` 에 배선이 없고, 스프링이
      #   이름만으로 프로퍼티에 잇는다(PICKAGE_OPS_S3_ACCESS_KEY ->
      #   pickage.ops.s3.access-key). 이름이 틀리면 예외가 아니라 **조용히**
      #   @Value 의 기본값으로 떨어져서, 값을 제대로 넣고도 "설정이 없습니다" 가 나온다.
      #   그 조합을 OpsEnvironmentContractTest 가 검사한다.
      PICKAGE_OPS_S3_ENDPOINT: ${PICKAGE_OPS_S3_ENDPOINT:-}
      PICKAGE_OPS_S3_ACCESS_KEY: ${PICKAGE_OPS_S3_ACCESS_KEY:-}
      PICKAGE_OPS_S3_SECRET_KEY: ${PICKAGE_OPS_S3_SECRET_KEY:-}
    ports:
      # 루프백에만 연다. 밖에서 오는 요청은 전부 nginx(443)를 지난다.
      # 이 줄을 "8080:8080" 으로 쓰면 TLS 도 인증도 없는 문이 하나 열린다.
      # 여기 남겨 둔 건 nginx 를 건너뛰고 앱만 확인하기 위해서다(장애 구분용).
      - "127.0.0.1:8080:8080"
    healthcheck:
      # 베이스 이미지(eclipse-temurin:21-jre)에 curl 이 이미 들어 있다. 확인함.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      # 스프링 기동 + Flyway 마이그레이션이 끝나기 전까지는 실패를 세지 않는다.
      # 이게 짧으면 정상 기동 중인 컨테이너가 unhealthy 로 죽어서 재시작 루프에 빠진다.
      start_period: 60s
    mem_limit: 1.6g
    memswap_limit: 1.6g   # 스왑 0. 위 postgres 의 주석 참고
    # ↑ 로컬 compose.yaml 의 api 와 같은 값. 로컬에서 미리 걸리라고 맞춰 둔 것이다.

  rag-api:
    # 130(백엔드)이 호출할 기능 비교 RAG 서버 (S15P21A506-178). ai-similarity와 달리
    # 일회성 배치가 아니라 상시 HTTP 서버로 뜬다 (2026-09-18 결정). GMS(LLM) 호출은
    # api 서비스와 같은 GMS_* 값을 이 노드의 .env에서 그대로 재사용한다 — 팀이 이미
    # 보유한 키라 새로 발급받지 않는다.
    #
    # ⚠ 175(청킹)~180(검증) 전체가 아직 실구현 전이다 — 지금 떠도 /compare 호출은
    #   NotImplementedError로 501/500이 난다(도커 이미지 빌드·기동 자체는 확인함).
    image: pickage-rag-api:${RAG_TAG:?.env 에 RAG_TAG 를 채울 것 — api·web 과 같은 규칙(커밋 SHA), 지금은 CI 미연결이라 수동}
    build:
      context: ../../../ai/rag
    restart: unless-stopped
    environment:
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-}
      GMS_REQUEST_PATH: ${GMS_REQUEST_PATH:-}
      GMS_AUTH_HEADER: ${GMS_AUTH_HEADER:-}
      GMS_AUTH_SCHEME: ${GMS_AUTH_SCHEME:-}
      GMS_MODEL: ${GMS_MODEL:-}
      # 176(2026-09-18 결정, DB 캐시 없이 그때그때 청킹) — 데이터팀이 이 노드에 이미
      # 올려둔 README 인계 파일 경로. 컨테이너 안에서도 같은 절대경로로 보이게
      # 아래 volumes에서 그대로 마운트한다(경로 자체를 바꾸지 않음).
      README_SOURCE_ROOT: /srv/pickage/docs
    volumes:
      # 데이터팀이 채워둔 README 인계 파일 — 컨테이너는 읽기만 한다(:ro).
      - /srv/pickage/docs:/srv/pickage/docs:ro
    # 호스트에 포트를 열지 않는다 — postgres와 같은 이유. api가 같은 compose 네트워크
    # 안에서 rag-api:8000 으로 붙으면 되고, 밖에 노출할 이유가 없다.
    mem_limit: 512m
    memswap_limit: 512m   # 스왑 0. 위 postgres 의 주석 참고

  web:
    # 이 서비스가 nginx 다. 프런트 정적 파일을 담은 이미지 위에 nginx 가 올라가 있다
    # (frontend/Dockerfile 2단계). 호스트 nginx 는 꺼 둔다 — 아래 README 참고.
    image: pickage-web:${WEB_TAG:?.env 에 WEB_TAG 를 채울 것 — 배포 job 이 커밋 SHA 로 갈아 끼운다}
    build:
      context: ../../../frontend
    restart: unless-stopped
    depends_on:
      api:
        # nginx 는 proxy_pass 의 호스트 이름을 기동할 때 한 번 푼다.
        # api 컨테이너가 없으면 "host not found in upstream" 으로 아예 못 뜬다.
        condition: service_healthy
    ports:
      # 여기만 0.0.0.0 이다. 밖에서 들어오는 문은 이 둘뿐이다.
      - "80:80"
      - "443:443"
    volumes:
      # 설정은 이미지에 굽지 않는다. 설정만 고칠 때 프런트를 다시 빌드하지 않기 위해서다.
      #   고친 뒤: docker compose exec web nginx -s reload
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # 호스트 certbot 이 만든 인증서를 그대로 쓴다. 읽기 전용이다.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      # 80 의 리다이렉트를 타지 않는 전용 경로. nginx/app.conf 를 볼 것.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    memswap_limit: 256m   # 스왑 0. nginx 가 스왑되면 들어오는 요청 전부가 같이 느려진다

  # ── Spark worker② (상시) ───────────────────────────────────────
  #
  # 09-09 결정: **배치 시각에만 띄우지 않고 상시로 둔다.**
  #
  # 원래는 profiles 에 넣어 배치 전후로 사람이 켜고 끄게 했다. 뒤집은 이유가 셋이다.
  #
  # 1. **켜고 끄는 주체가 문제다.** 그 코드는 data 노드의 배치 cron 에서 돌 텐데,
  #    다른 호스트의 컨테이너를 조작하려면 SSH 키를 주거나 Docker 소켓을 줘야 한다.
  #    소켓은 호스트 root 와 동등한 권한이다. **1GB 아끼자고 치를 값이 아니다.**
  # 2. **아끼는 게 생각보다 없다.** mem_limit 은 상한이지 예약이 아니라서,
  #    놀고 있는 worker 데몬은 6.5g 가 아니라 1GB 안팎을 쓴다.
  # 3. **위험이 줄지 않는다.** 진짜 부담은 배치 중 executor 5g 가 사용자 트래픽과
  #    부딪히는 것인데, 그건 컨테이너를 5분 전에 띄웠든 5일 전에 띄웠든 똑같다.
  #
  # 되돌릴 조건: 배치 중 이 노드에서 OOM 이 나거나 사용자 응답이 눈에 띄게 느려지면.
  # 그때는 실측이 있으니 판단 근거가 생긴다. (설계 문서는 "배치 시각만" 으로 되어 있다)
  #
  # ⚠ 이 노드의 여유는 얇다. postgres 2g + api 1.6g + web 0.25g 위에 배치 중
  #   worker②(executor 5g + 데몬 ~1g)가 얹힌다. 호스트에 스왑 2g 가 있지만
  #   **컨테이너에는 0 을 준다**
  #   (memswap_limit — ../README.md 의 "Swap"). 배치 중에 배포까지 겹치면 빌드가
  #   메모리를 더 먹는다 — 배치 시각에는 배포하지 않는 것이 맞다.
  #
  # ⚠ network_mode: host 다. 이유는 data 노드 compose 의 같은 주석 참고.
  #   웹 UI(8081)가 0.0.0.0 에 붙지만 이 노드는 80·443·22 만 열려 있다.
  spark-worker-2:
    image: apache/spark:3.5.3-python3
    network_mode: host
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://${SPARK_MASTER_HOST:?.env 에 data 노드의 사설 IP 를 넣을 것}:7077
      - --cores
      - "${SPARK_WORKER_CORES:?.env 에 넣을 것 — nproc 으로 확인한 값 이하}"
      - --memory
      # ⚠ mem_limit 6.5g 에서 데몬·비힙 몫을 뺀 값이다. .env.example 의 산수를 볼 것.
      - "${SPARK_WORKER_MEMORY:?.env 에 넣을 것 — 예: 5g}"
      # master 가 executor 를 띄우라고 이 포트로 되연결한다. 고정하지 않으면
      # 임의 포트라 방화벽을 통과하지 못하고 job 이 조용히 멈춘다.
      - --port
      - "40020"
      - --webui-port
      - "8081"
    environment:
      # 자동 탐지에 맡기면 docker0(172.17.0.1)를 광고할 수 있다.
      # 그러면 master 와 driver 가 이 worker 에 되연결하지 못한다.
      SPARK_LOCAL_IP: ${PRIVATE_IP:?.env 에 이 노드의 사설 IP 를 넣을 것}
      # ⚠ 여기 둘은 **`env_file: ./.env` 로 받지 않는다.** 그렇게 하면 `.env` 의 어느 줄이
      #   바뀌어도 이 서비스의 설정이 바뀐 것이 되어 compose 가 worker 를 다시 만든다.
      #   배포는 매번 같은 파일의 API_TAG·WEB_TAG 를 고치므로, **앱만 배포해도 Spark
      #   worker 가 재시작**하고 그때 돌던 배치의 executor 가 같이 죽는다.
      #   (compose 29.6.1 로 재현 확인 — env_file 쪽만 Recreated, 치환 쪽은 Running)
      #   그래서 이 컨테이너가 실제로 쓰는 값만 이름을 대서 넘긴다. spark-env.sh 가
      #   이 둘을 읽어 AWS_* 로 바꿔 s3a 에 넘긴다.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # 두 노드가 **같은 설정 파일**을 쓴다. 갈라지면 executor 만 설정이 다른
      # 상태가 되고, 그건 "일부 파티션만 실패" 로 나타난다.
      - ../spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ../spark/spark-env.sh:/opt/spark/conf/spark-env.sh:ro
    mem_limit: 6.5g
    memswap_limit: 6.5g   # 스왑 0. Spark 에 주면 안 되는 이유는 data/compose.yaml 의 worker① 주석

  similarity-loader:
    # 유사도 산출물을 similar_package 에 게시한다 (S15P21A506-371).
    #
    # MinIO 의 완료 포인터(pickage-vectors/_current.json)를 60초마다 보고, DB 에
    # 게시된 것과 다를 때만 pipeline/similar_package/load.py 를 부른다. 평상시
    # 하는 일은 객체 하나 GET 이라 상주시켜도 부담이 없다.
    #
    # data 노드가 이쪽을 호출하지 않는다 — 핸드오프가 MinIO 객체라서 두 노드가
    # 서로를 부를 필요가 없고, 그게 방식 C 로 나눈 값어치다 (README 참고).
    # 이 노드가 172.26.8.249:9000 으로 읽으러 간다. 그 포트는 Spark executor 용으로
    # 이미 열려 있어 새 인바운드 규칙이 없다.
    #
    # ⚠ 이미지에 코드가 없다. pipeline/Dockerfile 이 런타임만 굽고 저장소를
    #   마운트한다 — data 노드의 수집 런타임과 같은 이미지다.
    build:
      context: ../../../pipeline
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "pipeline.similar_package.watch"]
    command:
      - "--interval"
      - "60"
      - "--psql"
      - "psql"
      - "--database"
      - "${POSTGRES_DB}"
      - "--db-user"
      - "${POSTGRES_USER}"
    volumes:
      # ingest_raw.py 의 client() 가 ROOT 를 __file__ 기준 parents[2] 로 잡는다.
      # 저장소가 통째로 /opt/work 에 있어야 그 계산이 맞는다.
      - ../../..:/opt/work
    environment:
      # ⚠ docker.sock 을 마운트하지 않는다. load.py 의 --docker-container 모드를
      #   쓰려면 그게 필요한데, 이 노드는 인터넷에 노출된 유일한 노드다. 같은
      #   compose 네트워크 안이라 postgres:5432 가 그대로 보이므로 --psql 로 간다.
      #   README 가 5432 를 열지 말라고 한 것은 **다른 호스트**에서 붙는 경우다 —
      #   호스트에 포트를 여는 것이 아니라 형제 컨테이너가 네트워크로 붙는 것이다.
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 채울 것}
      # ⚠ 위의 MINIO_ROOT_* 를 재사용하지 말 것. 그것은 Spark executor 용이라
      #   권한 폭이 다르다. 이 파일에는 pickage-vectors 읽기 전용 계정만 넣는다.
      #   발급 절차는 deploy/prod/data/README.md 의 "app 노드에 줄 계정" 절.
      PICKAGE_MINIO_ENV: .env.loader
    mem_limit: 512m
    memswap_limit: 512m   # 스왑 0. 위 postgres 의 주석 참고

volumes:
  # 운영 DB. `down -v` 를 치면 여기가 사라진다 — README 의 경고를 볼 것.
  pgdata:
