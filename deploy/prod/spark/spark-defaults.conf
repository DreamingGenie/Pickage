# 운영 Spark 공용 설정 — data 노드의 master·worker① 과 app 노드의 worker② 가 같이 쓴다.
#
# 두 노드가 같은 파일을 마운트한다. 파일이 갈라지면 executor 만 설정이 다른
# 상태가 되고, 그건 "일부 파티션만 실패" 로 나타나서 원인을 찾기 어렵다.
#
# ── 버전 정합 (제일 중요) ──────────────────────────────────────
# hadoop-aws 는 Spark 가 내장한 Hadoop 버전과 **정확히 같아야** 한다.
# 하나라도 어긋나면 NoSuchMethodError 로 죽고 원인이 안 보인다.
#
#   이미지        apache/spark:3.5.3-python3   ← 로컬과 같은 태그
#   내장 Hadoop   3.3.4
#   따라서        hadoop-aws:3.3.4
#
# 확인 방법: docker run --rm apache/spark:3.5.3-python3 ls /opt/spark/jars | grep hadoop-client-api
#
# **커스텀 이미지를 만들지 않는 이유가 이 줄이다.** driver 가 이 패키지를 받아서
# executor 로 배포하므로, worker 노드에 jar 를 미리 심어 둘 필요가 없다.
# 레지스트리가 없는 구성에서 두 노드에 같은 커스텀 이미지를 옮길 방법이 없는데,
# 그 문제를 피해 간다.
spark.jars.packages                           org.apache.hadoop:hadoop-aws:3.3.4

# 내려받은 JAR 캐시. driver 가 도는 노드에만 쌓인다.
spark.jars.ivy                                /opt/work/.ivy2

# ── MinIO 접속 ────────────────────────────────────────────────
# ⚠ 서비스 이름(minio)이 아니라 **data 노드의 사설 IP** 다.
#
# app 노드의 worker② 는 다른 호스트에 있어서 compose 네트워크의 이름을 못 푼다.
# 그래서 두 노드가 다 닿을 수 있는 주소를 써야 하고, 그게 사설 IP 다.
#
# 이 주소가 바뀌면(인스턴스 교체 등) 여기와 deploy/prod/data/.env 를 같이 고칠 것.
# 틀리면 executor 가 파티션을 읽다가 연결 오류로 죽는다 — driver 는 멀쩡해서
# "일부 태스크만 실패" 로 보인다.
spark.hadoop.fs.s3a.endpoint                  http://172.26.8.249:9000

# 자격증명은 여기 적지 않는다. spark-env.sh 가 .env 의 MINIO_ROOT_* 을
# AWS_* 이름으로 내보내고 아래 provider 가 그걸 읽는다.
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# path-style 필수. 기본값(virtual-host)은 http://버킷명.endpoint/ 로 붙어서
# MinIO 가 응답하지 않는다.
spark.hadoop.fs.s3a.path.style.access         true

# 사설망 안의 http 다. TLS 없음.
spark.hadoop.fs.s3a.connection.ssl.enabled    false
