# 실시간 수집 대상과 폴링 주기 (Jira 98 / DATA_PLATFORM_PLAN 5-3절 호출 예산).
#
# 이 파일에는 secret을 넣지 않는다. 키는 collector/.env.local에서 읽는다.
# TOML을 쓴 이유는 Python 3.11+ 표준 tomllib으로 읽을 수 있어 의존성이 늘지
# 않으면서 주석을 달 수 있기 때문이다. JSON은 주석이 안 되고 YAML은 PyYAML이
# 새 의존성이 된다.
#
# ── 예산 산식 ─────────────────────────────────────────────────────────
#   풀별로  sum(86,400 / interval_seconds) <= hard_cap
#   지하철  OA-15799·OA-12601·OA-12764가 인증키 1개 한도를 공유하므로 합산
#   버스    상세기능마다 독립이므로 엔드포인트별로 따로 계산
# 스케줄러가 기동할 때 이 산식을 검증하고 초과하면 경고한다.

[defaults]
# 재시도도 quota를 소모한다. 실시간 수집은 1회 실패보다 하루 예산 소진이
# 훨씬 비싸므로 기본 시도 횟수를 CLI(3)보다 낮게 둔다.
max_attempts = 2

# 자동 중단 상한. provider 공식 한도는 1,000이고 검증용 여유를 남긴다.
hard_cap = 950

# 남은 호출이 이 값 이하로 떨어지면 재시도를 끊고 1회 시도만 한다.
# 배분안 A(지하철 864회)를 다 쓰면 86회가 남는데, 재시도가 그 잔량을 먹으면
# 수동 검증 호출을 할 수 없게 된다.
retry_reserve = 60

# 기동 직후 모든 대상이 동시에 호출되는 것을 막는 대상별 시작 간격(초).
stagger_seconds = 7

# 상태 요약 로그 주기(초).
heartbeat_seconds = 900

# 마지막 성공이 interval * 이 배수를 넘으면 수집 중단으로 보고 경고한다.
stall_factor = 3.0

# 재시도 의미가 없는 업무 오류(권한 없음 등)가 연속 이 횟수 발생하면
# 그 대상을 당일 중단한다. ERROR-340을 하루 480회 호출하는 사고를 막는다.
permanent_error_limit = 3


# ── 지하철 ────────────────────────────────────────────────────────────
# 배분안 A(위치 중심): 3 노선 x 300초 = 864회/일. 상한 950 이내.
#
# 대상 노선은 **잠정**이다. Route A 경로가 확정되면 교체한다.
# 1·2호선은 실호출 스모크로 응답을 확인했고(각 70행 26KB / 35행 13KB),
# 4호선은 OA-22522 시각표에 24시 이상 표기가 몰려 있어 운행일 규칙 검증에
# 쓸 수 있어 함께 넣었다.

[[targets]]
name = "subway_position_line1"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "1호선" }

[[targets]]
name = "subway_position_line2"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "2호선" }

[[targets]]
name = "subway_position_line4"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "4호선" }

# OA-15799 일괄 도착정보. 2026-08-26 실호출에서 ERROR-340("해당 인증키로는
# 실시간 도착정보(일괄)서비스를 사용할 수 없습니다")이 확인돼 비활성이다.
# 활성화하면 181바이트 오류 응답을 하루 480회 받으며 예산을 태운다.
# 활용사례 갤러리 등록 등으로 권한이 열리면 배분안 C로 전환한다.
[[targets]]
name = "subway_arrival_all"
source = "subway-arrival-all"
interval_seconds = 180
enabled = false
params = {}


# ── 버스 (fleet 확장 + key rotation) ──────────────────────────────────
# 목표: 서울 중심 사용률 높은 노선을 최대한 많이 수집.
#
# 버스는 노선 단위 호출(1콜=1노선)이라 노선 수가 곧 호출량이다. 상세기능별
# 독립 quota이고, key rotation으로 팀원 키를 함께 쓰면 예산이 키 수만큼 배가 된다.
#
#   담을 수 있는 노선 수 = (키 수 × 950) ÷ (86400 / 주기)
#
#   키 6개 · 위치 300초 → 최대 약 19노선
#   키 6개 · 위치 600초 → 최대 약 39노선
#   (도착은 예측값이라 600초로 성기게 둬 예산을 위치에 몰아준다)
#
# 기동 시 예산을 자동 검증한다. 초과하면 로그에 ** 초과 ** 가 찍히고, 노선/주기를
# 줄이거나 키를 늘리라고 안내한다. 그러니 아래 리스트에 노선을 마음껏 추가하고
# 기동 로그의 예산 줄만 확인하면 된다.
#
# ⚠️ busRouteId 목록은 **검증된 실제 ID만** 넣는다. 추측한 ID는 오류 응답을
#    받으며 quota를 태운다. 아래 3개는 실제 API 응답에서 관측된 값이다:
#      100100118 (753번), 100100026, 100100001 (01A)
#    "사용률 높은 노선" 대량 목록은 data.go.kr "노선정보조회 서비스"(getBusRouteList)
#    활용신청 후 채운다. 현재는 이 3개로 시드만 둔다.
#
# bus_route_id에 리스트를 주면 노선마다 대상 하나로 자동 확장된다
# (이름은 <name>_<route_id>). startOrd/endOrd는 위치 조회에 필수다.

[[targets]]
name = "bus_position"
source = "bus-position"
interval_seconds = 300
enabled = true
params = { bus_route_id = ["100100118", "100100026", "100100001"], start_ord = 1, end_ord = 200 }

[[targets]]
name = "bus_arrival"
source = "bus-arrival-all"
interval_seconds = 600
enabled = true
params = { bus_route_id = ["100100118", "100100026", "100100001"] }
