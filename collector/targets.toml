# 실시간 수집 대상과 폴링 주기 (Jira 98 / DATA_PLATFORM_PLAN 5-3절 호출 예산).
#
# 이 파일에는 secret을 넣지 않는다. 키는 collector/.env.local에서 읽는다.
# TOML을 쓴 이유는 Python 3.11+ 표준 tomllib으로 읽을 수 있어 의존성이 늘지
# 않으면서 주석을 달 수 있기 때문이다. JSON은 주석이 안 되고 YAML은 PyYAML이
# 새 의존성이 된다.
#
# ── 예산 산식 ─────────────────────────────────────────────────────────
#   풀별로  sum(86,400 / interval_seconds) <= hard_cap
#   지하철  OA-15799·OA-12601·OA-12764가 인증키 1개 한도를 공유하므로 합산
#   버스    상세기능마다 독립이므로 엔드포인트별로 따로 계산
# 스케줄러가 기동할 때 이 산식을 검증하고 초과하면 경고한다.

[defaults]
# 재시도도 quota를 소모한다. 실시간 수집은 1회 실패보다 하루 예산 소진이
# 훨씬 비싸므로 기본 시도 횟수를 CLI(3)보다 낮게 둔다.
max_attempts = 2

# 자동 중단 상한. provider 공식 한도는 1,000이고 검증용 여유를 남긴다.
hard_cap = 950

# 남은 호출이 이 값 이하로 떨어지면 재시도를 끊고 1회 시도만 한다.
# 배분안 A(지하철 864회)를 다 쓰면 86회가 남는데, 재시도가 그 잔량을 먹으면
# 수동 검증 호출을 할 수 없게 된다.
retry_reserve = 60

# 기동 직후 모든 대상이 동시에 호출되는 것을 막는 대상별 시작 간격(초).
stagger_seconds = 7

# 상태 요약 로그 주기(초).
heartbeat_seconds = 900

# 마지막 성공이 interval * 이 배수를 넘으면 수집 중단으로 보고 경고한다.
stall_factor = 3.0

# 재시도 의미가 없는 업무 오류(권한 없음 등)가 연속 이 횟수 발생하면
# 그 대상을 당일 중단한다. ERROR-340을 하루 480회 호출하는 사고를 막는다.
permanent_error_limit = 3


# ── 지하철 ────────────────────────────────────────────────────────────
# 배분안 A(위치 중심): 3 노선 x 300초 = 864회/일. 상한 950 이내.
#
# 대상 노선은 **잠정**이다. Route A 경로가 확정되면 교체한다.
# 1·2호선은 실호출 스모크로 응답을 확인했고(각 70행 26KB / 35행 13KB),
# 4호선은 OA-22522 시각표에 24시 이상 표기가 몰려 있어 운행일 규칙 검증에
# 쓸 수 있어 함께 넣었다.

[[targets]]
name = "subway_position_line1"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "1호선" }

[[targets]]
name = "subway_position_line2"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "2호선" }

[[targets]]
name = "subway_position_line4"
source = "subway-position"
interval_seconds = 300
enabled = true
params = { line_name = "4호선" }

# OA-15799 일괄 도착정보. 2026-08-26 실호출에서 ERROR-340("해당 인증키로는
# 실시간 도착정보(일괄)서비스를 사용할 수 없습니다")이 확인돼 비활성이다.
# 활성화하면 181바이트 오류 응답을 하루 480회 받으며 예산을 태운다.
# 활용사례 갤러리 등록 등으로 권한이 열리면 배분안 C로 전환한다.
[[targets]]
name = "subway_arrival_all"
source = "subway-arrival-all"
interval_seconds = 180
enabled = false
params = {}

# 버스 키 5개 · 위치 300초 → 예산상 최대 16개 노선
# 우선순위 목록 30개 중 상위 16개를 넣습니다 (나머지 14개는 키·주기 여유 시 확장)

# ── 버스 fleet (gen_bus_targets.py 생성) ─────────────────────────────
# 순위 상위부터 예산에 맞춰 자른 목록. 노선번호는 아래 주석 참고.
#    1위   143번 정릉~개포동 (간선, 100100022)
#    2위   160번 도봉산~온수동 (간선, 100100033)
#    3위   272번 면목동~남가좌동 (간선, 100100048)
#    4위   271번 용마문화복지센터~월드컵파크7단지 (간선, 100100047)
#    5위   130번 우이동~길동 (간선, 100100018)
#    6위   150번 도봉산~석수역 (간선, 100100029)
#    7위   152번 화계사~삼막사사거리 (간선, 100100031)
#    8위   360번 송파차고지~여의도 (간선, 100100057)
#    9위   273번 중랑차고지~동교동 (간선, 100100049)
#   10위   147번 월계동~도곡동 (간선, 100100026)
#   11위   340번 강동차고지~무지개아파트 (간선, 100100055)
#   12위   146번 상계주공7단지~강남역 (간선, 100100025)
#   13위   142번 도봉동~고속터미널 (간선, 100100021)
#   14위   163번 우이동~대방역 (간선, 100100032)
#   15위   420번 개포동~답십리역 (간선, 100100068)
#   16위   140번 도봉산역~AT센터 (간선, 100100019)

[[targets]]
name = "bus_position"
source = "bus-position"
interval_seconds = 300
enabled = true
params = { bus_route_id = ["100100022", "100100033", "100100048", "100100047", "100100018", "100100029", "100100031", "100100057", "100100049", "100100026", "100100055", "100100025", "100100021", "100100032", "100100068", "100100019"], start_ord = 1, end_ord = 200 }

[[targets]]
name = "bus_arrival"
source = "bus-arrival-all"
interval_seconds = 600
enabled = true
params = { bus_route_id = ["100100022", "100100033", "100100048", "100100047", "100100018", "100100029", "100100031", "100100057", "100100049", "100100026", "100100055", "100100025", "100100021", "100100032", "100100068", "100100019"] }
