# OA-15799 일괄 도착정보. 2026-08-26 실호출에서 ERROR-340이 확인돼 비활성이다.
# 활용사례 갤러리 등록 등으로 권한이 열리면 활성화한다.
[[targets]]
name = "subway_arrival_all"
source = "subway-arrival-all"
interval_seconds = 180
enabled = false
params = {}


# 버스 키 5개 · 위치 300초 → 예산상 최대 16개 노선
# 우선순위 목록 30개 중 상위 16개를 넣습니다 (나머지 14개는 키·주기 여유 시 확장)

# ── 버스 fleet (gen_bus_targets.py 생성) ─────────────────────────────
# 순위 상위부터 예산에 맞춰 자른 목록. 노선번호는 아래 주석 참고.
#    1위   143번 정릉~개포동 (간선, 100100022)
#    2위   160번 도봉산~온수동 (간선, 100100033)
#    3위   272번 면목동~남가좌동 (간선, 100100048)
#    4위   271번 용마문화복지센터~월드컵파크7단지 (간선, 100100047)
#    5위   130번 우이동~길동 (간선, 100100018)
#    6위   150번 도봉산~석수역 (간선, 100100029)
#    7위   152번 화계사~삼막사사거리 (간선, 100100031)
#    8위   360번 송파차고지~여의도 (간선, 100100057)
#    9위   273번 중랑차고지~동교동 (간선, 100100049)
#   10위   147번 월계동~도곡동 (간선, 100100026)
#   11위   340번 강동차고지~무지개아파트 (간선, 100100055)
#   12위   146번 상계주공7단지~강남역 (간선, 100100025)
#   13위   142번 도봉동~고속터미널 (간선, 100100021)
#   14위   163번 우이동~대방역 (간선, 100100032)
#   15위   420번 개포동~답십리역 (간선, 100100068)
#   16위   140번 도봉산역~AT센터 (간선, 100100019)

[[targets]]
name = "bus_position"
source = "bus-position"
interval_seconds = 300
enabled = true
params = { bus_route_id = ["100100022", "100100033", "100100048", "100100047", "100100018", "100100029", "100100031", "100100057", "100100049", "100100026", "100100055", "100100025", "100100021", "100100032", "100100068", "100100019"], start_ord = 1, end_ord = 200 }

[[targets]]
name = "bus_arrival"
source = "bus-arrival-all"
interval_seconds = 600
enabled = true
params = { bus_route_id = ["100100022", "100100033", "100100048", "100100047", "100100018", "100100029", "100100031", "100100057", "100100049", "100100026", "100100055", "100100025", "100100021", "100100032", "100100068", "100100019"] }
