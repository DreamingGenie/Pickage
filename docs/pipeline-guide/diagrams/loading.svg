<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="loading-desktop-title loading-desktop-desc">
  <title id="loading-desktop-title">Curated bundle PostgreSQL 적재</title>
  <desc id="loading-desktop-desc">검증과 변환을 거쳐 Spring Boot가 PostgreSQL에 트랜잭션으로 반영하는 흐름</desc>
  <defs>
    <marker id="loading-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="loading-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">Curated bundle → PostgreSQL</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Spring Boot 적재기는 게시된 bundle만 소비합니다.</text><rect x="40" y="135" width="230" height="145" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">공통 검증</text><text x="58" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest SHA</text><text x="58" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">marker·파일 목록</text><path d="M 280 207 L 345 207" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-desktop-arrow)"/><rect x="355" y="135" width="230" height="145" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="373" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">파일 변환</text><text x="373" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Parquet → TSV</text><text x="373" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">초기 적재는 64MiB</text><path d="M 595 207 L 660 207" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-desktop-arrow)"/><rect x="670" y="135" width="230" height="145" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="688" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">트랜잭션</text><text x="688" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">서비스 테이블</text><text x="688" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">한 스냅샷 단위</text><rect x="40" y="365" width="410" height="150" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="58" y="397" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">INITIAL  빈 DB</text><text x="58" y="426" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">64MiB 묶음 COPY</text><text x="58" y="451" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">실패하면 초기 적재부터 재실행</text><rect x="490" y="365" width="410" height="150" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="508" y="397" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">WEEKLY  기존 DB</text><text x="508" y="426" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">파일별 staging·receipt</text><text x="508" y="451" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">검증된 staging 재사용</text><text x="40" y="570" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">두 경로 모두 parent bundle과 현재 DB 기준을 확인한 뒤 트랜잭션을 확정합니다.</text>
</svg>
