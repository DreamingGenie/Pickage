<svg xmlns="http://www.w3.org/2000/svg" width="340" height="730" viewBox="0 0 340 730" role="img" aria-labelledby="loading-mobile-title loading-mobile-desc">
  <title id="loading-mobile-title">Curated bundle PostgreSQL 적재 모바일</title>
  <desc id="loading-mobile-desc">초기 적재와 주간 적재 중 하나를 선택하는 Spring Boot 흐름</desc>
  <defs>
    <marker id="loading-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="loading-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">bundle → PostgreSQL</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Spring Boot 적재 흐름</text><rect x="20" y="105" width="300" height="88" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="137" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">1  공통 검증</text><text x="38" y="166" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest SHA·marker</text><path d="M 170 208 L 170 233" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-mobile-arrow)"/><rect x="20" y="258" width="300" height="88" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="38" y="290" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">2  파일 변환</text><text x="38" y="319" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Parquet → TSV</text><path d="M 170 361 L 90 395" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-mobile-arrow)"/><path d="M 170 361 L 250 395" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-mobile-arrow)"/><rect x="20" y="410" width="140" height="110" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="442" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">INITIAL</text><text x="38" y="471" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">빈 DB</text><text x="38" y="496" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">64MiB COPY</text><rect x="180" y="410" width="140" height="110" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="198" y="442" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">WEEKLY</text><text x="198" y="471" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">기존 DB</text><text x="198" y="496" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">staging</text><path d="M 90 530 L 170 565" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-mobile-arrow)"/><path d="M 250 530 L 170 565" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#loading-mobile-arrow)"/><rect x="20" y="580" width="300" height="88" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="612" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">3  최종 트랜잭션</text><text x="38" y="641" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">서비스 테이블 확정</text>
