<svg xmlns="http://www.w3.org/2000/svg" width="340" height="760" viewBox="0 0 340 760" role="img" aria-labelledby="recovery-mobile-title recovery-mobile-desc">
  <title id="recovery-mobile-title">실패와 재개 흐름 모바일</title>
  <desc id="recovery-mobile-desc">실행 상태와 재개 조건을 세로로 보여주는 개념도</desc>
  <defs>
    <marker id="recovery-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="recovery-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">실패와 재개</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">원인 해결 후 같은 실행 재개</text><rect x="20" y="105" width="300" height="78" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="137" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">WAITING_INPUT</text><text x="38" y="166" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">입력·부모 대기</text><path d="M 170 195 L 170 220" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-mobile-arrow)"/><rect x="20" y="245" width="300" height="78" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="277" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">RUNNING</text><text x="38" y="306" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">단계 실행·events</text><path d="M 170 335 L 170 360" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-mobile-arrow)"/><path d="M 170 360 L 90 380" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-mobile-arrow)"/><path d="M 170 360 L 250 380" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-mobile-arrow)"/><rect x="20" y="395" width="140" height="92" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="427" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">COMPLETE</text><text x="38" y="456" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">bundle 게시</text><rect x="180" y="395" width="140" height="92" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="198" y="427" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">FAILED</text><text x="198" y="456" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">재시도 대기</text><path d="M320 440 H332 V285 H320" fill="none" stroke="#d97736" stroke-width="2" marker-end="url(#recovery-mobile-arrow)"/><path d="M 250 487 L 250 515" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-mobile-arrow)"/><rect x="180" y="525" width="140" height="105" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="198" y="557" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">BLOCKED</text><text x="198" y="586" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">계약 오류</text><text x="198" y="611" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">연속10회</text><text x="20" y="665" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">checkpoint 재사용 조건: 동일 계약</text><text x="20" y="700" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">BLOCKED는 원인 해결 후 수동 재개</text>
</svg>
