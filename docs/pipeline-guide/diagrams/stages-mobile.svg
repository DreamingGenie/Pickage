<svg xmlns="http://www.w3.org/2000/svg" width="340" height="850" viewBox="0 0 340 850" role="img" aria-labelledby="stages-mobile-title stages-mobile-desc">
  <title id="stages-mobile-title">전처리 단계 흐름 모바일</title>
  <desc id="stages-mobile-desc">6개 전처리 단계를 세로로 읽는 도식</desc>
  <defs>
    <marker id="stages-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="stages-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">전처리 6단계</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">실행 순서대로 읽습니다.</text><rect x="20" y="100" width="300" height="82" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="132" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">1  기준일·달력</text><text x="38" y="161" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Projects로 기준일 생성</text><path d="M 170 182 L 170 204" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-mobile-arrow)"/><rect x="20" y="212" width="300" height="82" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="244" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">2  패키지·버전</text><text x="38" y="273" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">versions와 요구사항</text><path d="M 170 294 L 170 316" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-mobile-arrow)"/><rect x="20" y="324" width="300" height="82" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="356" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">3  다운로드</text><text x="38" y="385" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">스냅샷 구간 집계</text><path d="M 170 406 L 170 428" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-mobile-arrow)"/><rect x="20" y="436" width="300" height="82" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="38" y="468" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">4  저장소 지표</text><text x="38" y="497" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">연결·품질 기록</text><path d="M 170 518 L 170 540" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-mobile-arrow)"/><rect x="20" y="548" width="300" height="82" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="580" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">5  패키지 스냅샷</text><text x="38" y="609" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">다운로드·저장소 지표</text><path d="M 170 630 L 170 652" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-mobile-arrow)"/><rect x="20" y="660" width="300" height="82" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="692" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">6  역의존</text><text x="38" y="721" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">요구사항·버전·기준일</text><text x="20" y="805" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">단계마다 manifest와 marker 기록</text>
</svg>
