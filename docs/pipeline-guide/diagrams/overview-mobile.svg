<svg xmlns="http://www.w3.org/2000/svg" width="340" height="840" viewBox="0 0 340 840" role="img" aria-labelledby="overview-mobile-title overview-mobile-desc">
  <title id="overview-mobile-title">전체 파이프라인 개요 모바일</title>
  <desc id="overview-mobile-desc">스냅샷 처리의 세 단계와 공통 검증 장치</desc>
  <defs>
    <marker id="overview-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="overview-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">raw → curated → DB</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">스냅샷 하나의 처리 흐름</text><rect x="20" y="105" width="300" height="125" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="137" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">1  수집 완료</text><text x="38" y="166" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">MinIO raw</text><text x="38" y="191" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest + _SUCCESS</text><rect x="20" y="270" width="300" height="125" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="38" y="302" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">2  전처리</text><text x="38" y="331" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">6개 단계</text><text x="38" y="356" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">검증 후 bundle 게시</text><rect x="20" y="435" width="300" height="125" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="467" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">3  DB 적재</text><text x="38" y="496" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Spring Boot</text><text x="38" y="521" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">PostgreSQL 트랜잭션</text><path d="M 170 230 L 170 262" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#overview-mobile-arrow)"/><path d="M 170 395 L 170 427" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#overview-mobile-arrow)"/><rect x="20" y="600" width="300" height="125" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="38" y="632" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">항상 함께 검증</text><text x="38" y="661" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">계약·SHA·checkpoint</text><text x="38" y="686" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">로그·재시도·완료 marker</text><text x="20" y="790" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">주황색 선 = 흐름</text>
</svg>
