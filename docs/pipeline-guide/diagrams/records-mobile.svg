<svg xmlns="http://www.w3.org/2000/svg" width="340" height="820" viewBox="0 0 340 820" role="img" aria-labelledby="records-mobile-title records-mobile-desc">
  <title id="records-mobile-title">데이터 레코드 흐름 모바일</title>
  <desc id="records-mobile-desc">raw가 Curated bundle을 거쳐 PostgreSQL의 마스터와 snapshot 테이블로 반영되는 흐름</desc>
  <defs>
    <marker id="records-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="records-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">raw → curated → DB</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">데이터 형태의 변화</text><rect x="20" y="105" width="300" height="150" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="137" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">raw 입력</text><text x="38" y="166" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">versions_min</text><text x="38" y="191" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">requirements</text><text x="38" y="216" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">projects</text><text x="38" y="241" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">downloads</text><path d="M 170 275 L 170 300" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-mobile-arrow)"/><rect x="20" y="330" width="300" height="125" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="38" y="362" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">curated</text><text x="38" y="391" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package_version</text><text x="38" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package_snapshot</text><text x="38" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">dependents</text><path d="M 170 470 L 170 495" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-mobile-arrow)"/><rect x="20" y="525" width="300" height="105" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="557" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO bundle</text><text x="38" y="586" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest + _SUCCESS</text><text x="38" y="611" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">SHA로 고정</text><path d="M 170 645 L 170 670" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-mobile-arrow)"/><rect x="20" y="700" width="300" height="105" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="38" y="732" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">PostgreSQL</text><text x="38" y="761" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">마스터·두 snapshot 테이블</text><text x="38" y="786" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">dependents NULL 제외</text>
</svg>
