<svg xmlns="http://www.w3.org/2000/svg" width="340" height="860" viewBox="0 0 340 860" role="img" aria-labelledby="storage-mobile-title storage-mobile-desc">
  <title id="storage-mobile-title">저장소와 작업 공간 모바일</title>
  <desc id="storage-mobile-desc">raw부터 PostgreSQL까지 저장 역할과 처리용 공간 배정을 보여주는 도식</desc>
  <defs>
    <marker id="storage-mobile-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="storage-mobile-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="20" y="40" font-family="Arial, Pretendard, sans-serif" font-size="25px" font-weight="700" fill="#143b36" text-anchor="start">저장소 역할</text><text x="20" y="70" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">영구 데이터와 작업 공간을 구분</text><rect x="20" y="105" width="300" height="92" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="137" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO raw</text><text x="38" y="166" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">수집 원본·manifest</text><path d="M 170 212 L 170 237" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#storage-mobile-arrow)"/><rect x="20" y="262" width="300" height="110" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="38" y="294" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">작업 공간</text><text x="38" y="323" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">checkpoint·events</text><text x="38" y="348" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">임시 파일·spill</text><path d="M 170 387 L 170 412" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#storage-mobile-arrow)"/><rect x="20" y="437" width="300" height="92" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="38" y="469" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO curated</text><text x="38" y="498" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">완료 bundle·_SUCCESS</text><path d="M 170 544 L 170 569" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#storage-mobile-arrow)"/><rect x="20" y="594" width="300" height="108" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="38" y="626" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">PostgreSQL</text><text x="38" y="655" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">서비스·staging/receipt</text><rect x="20" y="730" width="300" height="100" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="38" y="762" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">처리용 합계</text><text x="38" y="791" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">합계 49.5GB</text><text x="38" y="816" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">영구 데이터 제외</text>
</svg>
