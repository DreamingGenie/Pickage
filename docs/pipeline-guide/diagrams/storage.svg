<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="storage-desktop-title storage-desktop-desc">
  <title id="storage-desktop-title">저장소와 작업 공간</title>
  <desc id="storage-desktop-desc">raw, 작업 공간, curated, PostgreSQL의 저장 역할과 흐름</desc>
  <defs>
    <marker id="storage-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="storage-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">무엇을 어디에 보관하는가</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">영구 데이터와 실행 중 임시 공간을 구분합니다.</text><rect x="40" y="135" width="260" height="155" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO raw</text><text x="58" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">수집 원본</text><text x="58" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">영구 보관 대상</text><path d="M 310 212 L 365 212" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#storage-desktop-arrow)"/><rect x="375" y="135" width="260" height="155" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="393" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">작업 공간</text><text x="393" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">checkpoint·events</text><text x="393" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">임시 파일·spill</text><path d="M 645 212 L 700 212" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#storage-desktop-arrow)"/><rect x="710" y="135" width="190" height="155" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="728" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO curated</text><text x="728" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">완료 bundle</text><text x="728" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">영구 결과</text><rect x="40" y="370" width="860" height="150" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="58" y="402" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">처리용 공간 배정</text><text x="58" y="431" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">전처리 28GB  +  PostgreSQL 17GB  +  로더 4GB  +  로그 0.5GB  =  49.5GB</text><text x="58" y="456" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">이 계산은 처리용 합계이며, 영구 raw와 최종 Curated·DB 데이터는 제외합니다.</text><text x="40" y="575" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">PostgreSQL에는 서비스 테이블과 staging·receipt가 함께 사용됩니다.</text>
</svg>
