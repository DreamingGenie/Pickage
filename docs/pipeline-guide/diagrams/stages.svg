<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" aria-labelledby="stages-desktop-title stages-desktop-desc">
  <title id="stages-desktop-title">전처리 단계 흐름</title>
  <desc id="stages-desktop-desc">6개 전처리 단계를 실제 실행 순서대로 보여주는 흐름</desc>
  <defs>
    <marker id="stages-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="stages-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">전처리 6단계</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">실제 실행 순서입니다. 각 단계는 승인된 산출물을 다음 단계에 넘깁니다.</text><rect x="40" y="140" width="250" height="112" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">1  기준일·달력</text><text x="58" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">기준일·달력</text><text x="58" y="226" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: snapshot</text><rect x="330" y="140" width="250" height="112" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="348" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">2  패키지·버전</text><text x="348" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">versions_min/full</text><text x="348" y="226" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: package_version</text><rect x="620" y="140" width="250" height="112" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="638" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">3  다운로드</text><text x="638" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">구간 다운로드</text><text x="638" y="226" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: downloads</text><rect x="620" y="355" width="250" height="112" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="638" y="387" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">4  저장소 지표</text><text x="638" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">저장소 지표</text><text x="638" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: repository</text><rect x="330" y="355" width="250" height="112" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="348" y="387" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">5  패키지 스냅샷</text><text x="348" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">다운로드·저장소 지표</text><text x="348" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: package_snapshot</text><rect x="40" y="355" width="250" height="112" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="387" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">6  역의존</text><text x="58" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">요구사항·버전·기준일</text><text x="58" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">stage: dependents</text><path d="M 290 196 L 320 196" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-desktop-arrow)"/><path d="M 580 196 L 610 196" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-desktop-arrow)"/><path d="M 745 252 L 745 345" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-desktop-arrow)"/><path d="M 620 411 L 590 411" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-desktop-arrow)"/><path d="M 330 411 L 300 411" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#stages-desktop-arrow)"/><text x="40" y="555" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest와 _SUCCESS가 확인된 산출물만 다음 단계의 입력이 됩니다.</text>
</svg>
