<svg xmlns="http://www.w3.org/2000/svg" width="940" height="630" viewBox="0 0 940 630" role="img" aria-labelledby="records-desktop-title records-desktop-desc">
  <title id="records-desktop-title">데이터 레코드 흐름</title>
  <desc id="records-desktop-desc">raw 테이블이 curated 산출물과 MinIO bundle로 변환되는 개념도</desc>
  <defs>
    <marker id="records-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="records-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">raw 행이 curated 행이 되는 방식</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">설명용 작은 예시입니다. 실제 행 수와 값은 스냅샷마다 다릅니다.</text><rect x="40" y="135" width="210" height="155" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">raw 입력</text><text x="58" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">versions_min</text><text x="58" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">requirements</text><text x="58" y="246" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">projects</text><text x="58" y="271" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">downloads</text><path d="M 260 212 L 315 212" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-desktop-arrow)"/><rect x="325" y="135" width="230" height="155" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="343" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">curated 산출물</text><text x="343" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package_version</text><text x="343" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package_snapshot</text><text x="343" y="246" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">dependents</text><path d="M 565 212 L 620 212" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-desktop-arrow)"/><rect x="630" y="135" width="150" height="155" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="648" y="167" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">MinIO</text><text x="648" y="196" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">bundle</text><text x="648" y="221" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">_SUCCESS</text><path d="M 705 290 L 705 350" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#records-desktop-arrow)"/><rect x="40" y="360" width="860" height="145" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="58" y="392" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">PostgreSQL 결과</text><text x="58" y="421" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package·version 마스터</text><text x="58" y="446" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package_snapshot · package_version_snapshot</text><text x="58" y="471" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">dependents_count: NULL만 제외, 0은 저장</text><text x="40" y="560" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">package는 이름·ID, version은 패키지 버전, snapshot은 관측 기준일로 식별합니다.</text>
</svg>
