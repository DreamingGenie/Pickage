<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650" role="img" aria-labelledby="overview-desktop-title overview-desktop-desc">
  <title id="overview-desktop-title">전체 파이프라인 개요</title>
  <desc id="overview-desktop-desc">raw 수집 완료에서 Curated 게시와 PostgreSQL 적재까지의 세 단계 흐름</desc>
  <defs>
    <marker id="overview-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="overview-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">raw → curated → PostgreSQL</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">한 스냅샷을 검증하고, 계산 결과를 게시한 뒤 적재합니다.</text><rect x="40" y="145" width="240" height="150" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="58" y="177" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">1  수집 완료</text><text x="58" y="206" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">MinIO raw</text><text x="58" y="231" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">manifest + _SUCCESS</text><rect x="350" y="145" width="240" height="150" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="368" y="177" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">2  전처리</text><text x="368" y="206" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">6개 단계 실행</text><text x="368" y="231" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">검증 후 bundle 게시</text><rect x="660" y="145" width="240" height="150" rx="16" fill="#ffffff" stroke="#143b36" stroke-width="2"/><text x="678" y="177" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">3  DB 적재</text><text x="678" y="206" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">Spring Boot 배치</text><text x="678" y="231" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">PostgreSQL 트랜잭션 반영</text><path d="M 280 220 L 340 220" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#overview-desktop-arrow)"/><path d="M 590 220 L 650 220" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#overview-desktop-arrow)"/><rect x="40" y="370" width="860" height="145" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="58" y="402" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">공통 안전장치</text><text x="58" y="431" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">입력·코드 계약  |  단계별 checkpoint  |  실패 로그·재시도  |  완료 bundle만 소비</text><text x="40" y="570" font-family="Arial, Pretendard, sans-serif" font-size="19px" font-weight="700" fill="#143b36" text-anchor="start">읽는 법</text><text x="40" y="602" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">주황색 화살표는 데이터/제어 흐름, 점선은 직접 실행이 아닌 개념적 연결입니다.</text>
</svg>
