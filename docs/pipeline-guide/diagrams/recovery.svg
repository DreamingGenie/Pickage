<svg xmlns="http://www.w3.org/2000/svg" width="940" height="780" viewBox="0 0 940 780" role="img" aria-labelledby="recovery-desktop-title recovery-desktop-desc">
  <title id="recovery-desktop-title">실패와 재개 흐름</title>
  <desc id="recovery-desktop-desc">입력 대기, 실행, 실패 재시도, 차단, 완료 상태의 개념적 흐름</desc>
  <defs>
    <marker id="recovery-desktop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97736"/></marker>
    <marker id="recovery-desktop-arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a706b"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f2f7f4"/>
  <text x="40" y="48" font-family="Arial, Pretendard, sans-serif" font-size="28px" font-weight="700" fill="#143b36" text-anchor="start">실패해도 이어갈 수 있는 실행</text><text x="40" y="79" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">상태와 증거를 남겨 원인을 고친 뒤 같은 입력을 재개합니다.</text><rect x="40" y="140" width="190" height="125" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="58" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">WAITING_INPUT</text><text x="58" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">입력·부모 대기</text><path d="M 240 202 L 290 202" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-desktop-arrow)"/><rect x="300" y="140" width="190" height="125" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="318" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">RUNNING</text><text x="318" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">단계 실행</text><text x="318" y="226" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">events 기록</text><path d="M 500 202 L 550 202" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-desktop-arrow)"/><rect x="560" y="140" width="190" height="125" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="578" y="172" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">COMPLETE</text><text x="578" y="201" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">bundle 게시</text><text x="578" y="226" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">다음 회차 허용</text><path d="M 360 270 L 360 345" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-desktop-arrow)"/><text x="375" y="315" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#d97736" text-anchor="start">일시 실패</text><rect x="300" y="355" width="190" height="125" rx="16" fill="#fff8f3" stroke="#143b36" stroke-width="2"/><text x="318" y="387" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">FAILED</text><text x="318" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">재시도 대기</text><text x="318" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">10분~1시간</text><path d="M300 417 H260 V240 H290" fill="none" stroke="#d97736" stroke-width="3" marker-end="url(#recovery-desktop-arrow)"/><text x="155" y="335" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#143b36" text-anchor="start">재시도</text><path d="M470 265 V300 H710 V345" fill="none" stroke="#d97736" stroke-width="3" marker-end="url(#recovery-desktop-arrow)"/><text x="555" y="288" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#d97736" text-anchor="start">계약 오류</text><path d="M 500 417 L 610 417" fill="none" stroke="#d97736" stroke-width="3" stroke-linecap="round" marker-end="url(#recovery-desktop-arrow)"/><text x="510" y="450" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#d97736" text-anchor="start">연속 10회</text><rect x="620" y="355" width="220" height="125" rx="16" fill="#e7f0ec" stroke="#143b36" stroke-width="2"/><text x="638" y="387" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">BLOCKED</text><text x="638" y="416" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">자동 중단</text><text x="638" y="441" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">원인 해결 필요</text><rect x="40" y="550" width="860" height="120" rx="16" fill="white" stroke="#143b36" stroke-width="2"/><text x="58" y="582" font-family="Arial, Pretendard, sans-serif" font-size="21px" font-weight="700" fill="#1d2c2a" text-anchor="start">재개 조건</text><text x="58" y="611" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">같은 run_id·입력·코드 계약일 때 checkpoint를 재검증하고 재사용합니다.</text><text x="40" y="715" font-family="Arial, Pretendard, sans-serif" font-size="18px" font-weight="400" fill="#5a706b" text-anchor="start">계약 오류는 즉시 차단합니다. 일시 실패는 정해진 횟수까지만 재시도합니다.</text>
</svg>
