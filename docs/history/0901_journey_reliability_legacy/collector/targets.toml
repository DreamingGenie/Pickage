# 실시간 수집 대상과 폴링 주기 (Jira 98 / DATA_PLATFORM_PLAN 5-3절 호출 예산).
#
# 이 파일에는 secret을 넣지 않는다. 키는 collector/.env.local에서 읽는다.
# TOML을 쓴 이유는 Python 3.11+ 표준 tomllib으로 읽을 수 있어 의존성이 늘지
# 않으면서 주석을 달 수 있기 때문이다. JSON은 주석이 안 되고 YAML은 PyYAML이
# 새 의존성이 된다.
#
# ── 예산 산식 ─────────────────────────────────────────────────────────
#   풀별로  sum(86,400 / interval_seconds) <= hard_cap
#   지하철  OA-15799·OA-12601·OA-12764가 인증키 1개 한도를 공유하므로 합산
#   버스    상세기능마다 독립이므로 엔드포인트별로 따로 계산
# 스케줄러가 기동할 때 이 산식을 검증하고 초과하면 경고한다.

[defaults]
# 재시도도 quota를 소모한다. 실시간 수집은 1회 실패보다 하루 예산 소진이
# 훨씬 비싸므로 기본 시도 횟수를 CLI(3)보다 낮게 둔다.
max_attempts = 2

# 자동 중단 상한. provider 공식 한도는 1,000이고 검증용 여유를 남긴다.
hard_cap = 950

# 남은 호출이 이 값 이하로 떨어지면 재시도를 끊고 1회 시도만 한다.
# 배분안 A(지하철 864회)를 다 쓰면 86회가 남는데, 재시도가 그 잔량을 먹으면
# 수동 검증 호출을 할 수 없게 된다.
retry_reserve = 60

# 기동 직후 동시 호출을 막는 대상별 시작 간격(초). 대상 수가 많으면(수백)
# 이 값이 크면 초기 램프가 길어진다(간격 × 대상수). 240대상엔 1초가 적당.
stagger_seconds = 1

# 상태 요약 로그 주기(초).
heartbeat_seconds = 900

# 마지막 성공이 interval * 이 배수를 넘으면 수집 중단으로 보고 경고한다.
stall_factor = 3.0

# 재시도 의미가 없는 업무 오류(권한 없음 등)가 연속 이 횟수 발생하면
# 그 대상을 당일 중단한다. ERROR-340을 하루 480회 호출하는 사고를 막는다.
permanent_error_limit = 3


[key_caps]
# 인증키별 일일 한도(슬롯 순서: base, _2, _3 ...). 미지정 슬롯은 defaults.hard_cap.
# 버스: 전 키 운영계정 10000 → 여유 두고 전부 9500. 풀 예산 6×9500=57000.
DATA_GO_BUS_API_KEY = [9500, 9500, 9500, 9500, 9500, 9500]


# ── 지하철 (서울 핵심 1~9호선) ────────────────────────────────────────
# 5키 rotation으로 유효상한 4750. 9노선 x 120초 = 6480회/일 (6키 유효상한 5700 초과, 의도된 오버구독).
# 3노선 300초→9노선 120초. 6키 예산을 초과해 낮 관측을 촘촘히 하고
# 예상 소진 ~01:0x(지하철 막차 이후)까지 그 풀을 굴린다. 늦은 밤 저운행 구간만 포기.. 위치 관측이
# 조밀할수록 열차 구간 이동·도착 시점 추정이 정확해진다.
# 16개 전 노선(경의중앙·공항철도 등 포함)은 전부 실호출 검증됐고, 커버리지를
# 최대화하려면 300초로 16노선까지 넣을 수 있다(4608회).

[[targets]]
name = "subway_position_line1"
source = "subway-position"
interval_seconds = 120
enabled = true
params = { line_name = "1호선" }

[[targets]]
name = "subway_position_line2"
source = "subway-position"
interval_seconds = 120
enabled = true
params = { line_name = "2호선" }

