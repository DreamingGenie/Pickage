# pipeline/ 의 빠른 층 파이썬 시험을 PR 마다 돌린다.
#
# GitLab CI(.gitlab-ci.yml)는 pipeline/ 파이썬 시험을 돌리지 않았다 — `pipeline-ok` 는 러너가
# 살아 있는지만 보는 echo 한 줄이다. 그래서 수집기·주간 실행기의 시험은 있어도 머지를 막지
# 못했다. 저장소가 GitHub 로 옮겨 온 뒤 그 자리를 이 워크플로가 채운다.
#
# 무엇을 돌리는지는 scripts/run-pipeline-tests.sh 가 정본이다. 로컬에서도 같은 명령을 쓴다.
# 외부 서비스(BigQuery·GCS·MinIO·PostgreSQL)는 부르지 않는다. 자격증명도 쓰지 않는다.
name: pipeline-tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "scripts/run-pipeline-tests.sh"
      - ".github/workflows/pipeline-tests.yml"
  push:
    branches: [develop, main]
    paths:
      - "pipeline/**"
      - "scripts/run-pipeline-tests.sh"
      - ".github/workflows/pipeline-tests.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/collectors/requirements.txt
            pipeline/minio/requirements.txt
      - name: 의존성 설치
        run: pip install -r pipeline/collectors/requirements.txt -r pipeline/minio/requirements.txt
      - name: 빠른 층 시험
        run: sh scripts/run-pipeline-tests.sh
