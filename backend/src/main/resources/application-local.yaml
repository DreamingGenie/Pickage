# 로컬 개발 전용.
#
# 여기 값은 내 PC 에만 존재하므로 비밀이 아니다 → 커밋한다.
# 이 파일이 있어야 `.env` 복사 같은 사전 단계 없이 바로 뜬다.
spring:
  datasource:
    # 리포 루트 compose.yaml 의 postgres 서비스.
    # 호스트에는 15432 로 노출돼 있다 (PC 에 설치된 Postgres 와 충돌 방지).
    #
    # API 를 컨테이너 안에서 돌릴 때는 이 값이 맞지 않는다 —
    # 그때는 compose 가 SPRING_DATASOURCE_URL 환경변수로 덮어쓴다.
    url: jdbc:postgresql://localhost:15432/pickage
    username: postgres
    password: pickage

  jpa:
    # 로컬에서만 SQL 을 찍는다. 쿼리가 의도대로 나가는지 눈으로 본다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
