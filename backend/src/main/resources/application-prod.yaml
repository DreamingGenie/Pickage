# 운영 전용.
#
# 이 파일에는 값을 적지 않는다. 자리만 만들고 실제 값은 서버의
# deploy/prod/app/.env 에서 환경변수로 들어온다.
# (application.yaml 머리말의 규칙 — 공개돼도 아무 일 없는 값만 커밋한다)
spring:
  datasource:
    # 로컬은 SPRING_DATASOURCE_URL 로 덮어쓰는데 여기는 DB_URL 을 쓴다. 이름이 다른 게 의도다.
    #
    #   로컬: application-local.yaml 에 기본값이 있다 → 환경변수가 없어도 뜬다
    #   운영: 기본값이 없다 → 이 파일만 읽으면 무엇을 넣어야 하는지 전부 나온다
    #
    # ⚠ 값이 비어도 스프링은 어느 변수가 없는지 말해 주지 않는다. 확인해 본 결과다 —
    #   Binder 는 못 푼 ${...} 를 문자열 그대로 넘기고, Hikari 가
    #   'url' must start with "jdbc" 라고만 한다. 로그 어디에도 DB_URL 이 안 나온다.
    #   그래서 "안 채웠다" 를 잡는 검사는 여기가 아니라 compose 가 한다 —
    #   deploy/prod/app/compose.yaml 의 ${VAR:?...} 가 컨테이너를 만들기 전에 막는다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # api 컨테이너 하나, 서버 물리 2코어. 커넥션을 더 잡아도 DB 앞에서 줄만 길어진다.
      maximum-pool-size: 10

server:
  # nginx 뒤에 있다. 이 줄이 없으면 스프링은 자기가 http://localhost:8080 인 줄 알고
  # 리다이렉트와 Swagger 의 서버 주소를 http 로 만든다. 브라우저는 https 페이지에서
  # 나가는 http 요청을 막으므로, 화면은 뜨는데 "Try it out" 만 안 되는 상태가 된다.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # health 만 연다. 기본값도 그렇지만 명시한다 — 나중에 누가 로컬에서 편하려고
        # 공통 application.yaml 에 include: "*" 를 적으면, 운영에서 /actuator/env 로
        # DB 비밀번호가 그대로 보인다. 이 줄이 그걸 막는다.
        include: health
  endpoint:
    health:
      # 세부 항목을 감춘다. 밖에서는 UP 인지만 알면 되고,
      # DB 종류·버전·디스크 여유는 알릴 이유가 없다.
      show-details: never

logging:
  level:
    root: INFO

# ── 주간 수집 운영 API (S15P21A506-347) ────────────────────────
#
# 수집은 data 노드에서 돌고 상태는 그 노드의 MinIO 객체에 있다. api 는 읽기만 하고,
# 수동 실행 요청만 우편함 객체로 쓴다. (WeeklyStateStore 주석)
#
# **여기에 pickage.ops.s3.* 를 적지 않는다.** 기본값이 WeeklyStateStore 의 @Value 에
# 이미 있는데 여기에 또 두면, 코드 쪽을 고친 사람이 "왜 안 먹지" 를 겪는다 — 이 파일이
# 프로퍼티를 정의해 버려서 코드의 기본값은 운영에서 영영 쓰이지 않기 때문이다.
#
# 대신 환경변수 이름을 프로퍼티에 맞춰 두었다. 스프링이 이름만으로 이어 준다:
#
#   PICKAGE_OPS_S3_ENDPOINT     -> pickage.ops.s3.endpoint
#   PICKAGE_OPS_S3_ACCESS_KEY   -> pickage.ops.s3.access-key    (하이픈도 _ 로)
#   PICKAGE_OPS_S3_SECRET_KEY   -> pickage.ops.s3.secret-key
#   PICKAGE_OPS_S3_BUCKET       -> pickage.ops.s3.bucket        (기본 pickage-raw)
#
# ⚠ 그래서 **이름이 틀려도 조용하다.** 못 찾으면 예외가 아니라 @Value 의 기본값으로
#   떨어지고, ops API 만 "설정이 없습니다" 로 답한다. 이름을 두 곳(여기 설명·compose)에
#   적어 두는 대신 OpsEnvironmentContractTest 가 compose 와 코드를 대조한다.
#
# 값을 넣는 곳은 deploy/prod/app/.env 이고, compose 가 api 컨테이너로 넘긴다.
