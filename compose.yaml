# Pickage 로컬 개발 환경
#
#   docker compose --profile api  up     postgres + api
#   docker compose --profile data up     minio + spark
#   docker compose --profile all  up     전부
#
# 사용법·주의사항: deploy/local/README.md
#
# ⚠ `down -v` 를 쓰지 말 것. MinIO 에 적재한 원본 데이터까지 지운다.
#   초기화가 필요하면 README 의 "초기화" 절을 볼 것.

# 프로젝트 이름. 컨테이너·네트워크·볼륨 이름의 접두사가 된다.
#   pickage-local-postgres-1 / pickage-local_minio-data / ...
#
# 운영은 pickage-prod 를 쓴다. 이름이 환경을 드러내므로,
# 운영 compose 를 실수로 로컬에서 띄우면 `docker ps` 에서 바로 보인다.
#
# ⚠ 이 이름을 바꾸면 볼륨 이름도 같이 바뀌어 기존 데이터가 고아가 된다.
name: pickage-local

services:
  # ── 백엔드 파트 ────────────────────────────────────────────────

  postgres:
    profiles: ["api", "all"]
    # 서비스 이름이 곧 컨테이너 네트워크 안의 호스트명이 된다.
    # 그래서 api 컨테이너는 localhost 가 아니라 postgres:5432 로 붙는다.
    image: postgres:16
    environment:
      # 로컬 전용 값. 내 PC 에만 존재하므로 비밀이 아니다.
      POSTGRES_PASSWORD: pickage
      POSTGRES_DB: pickage
    ports:
      # 5432 를 그대로 열지 않는 이유: PC 에 Postgres 를 따로 설치한 사람과 충돌한다.
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 시드 스크립트. psql -f 로 컨테이너 안에서 바로 읽는다.
      # 호스트에서 파이프로 밀어 넣지 않는 이유: `<` 리다이렉트가 셸마다 달라
      # PowerShell 과 Git Bash 에서 같은 명령을 쓸 수 없게 된다.
      - ./deploy/local/seed:/seed:ro
    healthcheck:
      # "컨테이너가 떴다" 와 "DB 가 연결을 받는다" 는 다르다.
      # 아래 api 서비스가 이 판정을 기다린다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickage"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    profiles: ["api", "all"]
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 컨테이너 안에서 localhost 는 컨테이너 자신이다. 내 PC 가 아니다.
      # 포트도 15432 가 아니라 컨테이너 안의 5432 다.
      #
      # application-local.yaml 을 고치지 않는다 —
      # Spring 은 환경변수를 설정 파일보다 우선하므로 이 줄이 이긴다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pickage
    mem_limit: 1.6g
    # ↑ 운영 서버의 api 컨테이너와 같은 메모리 상한.
    #   32GB PC 에서 멀쩡하던 것이 서버 1.6GB 제한에서 죽는 사고를 로컬에서 미리 잡는다.

  # ── 데이터 파트 ────────────────────────────────────────────────
  #
  # 첫 실행 전에 자격증명 파일을 만들어야 한다:
  #   cp pipeline/minio/.env.example pipeline/minio/.env   후 비밀번호 설정

  minio:
    profiles: ["data", "all"]
    # 태그가 아니라 다이제스트로 고정한다. 태그는 같은 이름으로 재발행될 수 있다.
    #
    # ⚠ 운영은 **더 오래된 버전**을 쓴다 (deploy/prod/data/compose.yaml —
    #   minio/minio:RELEASE.2025-04-22T22-12-26Z, 웹 콘솔이 온전한 것을 확인해 고정).
    #   그래서 **여기서 검증한 S3 동작이 운영에서 그대로라는 보장이 없다.**
    #   서버에서만 나는 mc·멀티파트·프리사인 URL 오류는 이 차이를 먼저 의심할 것.
    #   AGENTS.md 의 "알려진 환경 차이" 참고.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — 코드가 붙는 곳
      - "127.0.0.1:9001:9001"   # 웹 콘솔 — 브라우저로 확인
    env_file: ./pipeline/minio/.env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    profiles: ["data", "all"]
    # 없는 버킷만 만든다. 한 번 돌고 끝나는 일회성 컨테이너다.
    # Exited (0) 이 정상 — 초기화 성공을 뜻한다.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./pipeline/minio/.env
    volumes:
      - ./pipeline/minio/init-buckets.sh:/init-buckets.sh:ro

  spark:
    profiles: ["data", "all"]
    image: apache/spark:3.5.3-python3
    depends_on:
      minio-init:
        # 버킷이 만들어진 뒤에 뜬다.
        condition: service_completed_successfully
    # MinIO 자격증명을 그대로 물려받는다. spark-env.sh 가 이 값을 s3a 가 읽는
    # 환경변수 이름으로 바꿔 준다 — .env 에 값을 두 번 적지 않아도 된다.
    env_file: ./pipeline/minio/.env
    volumes:
      # 잡 코드. 호스트에서 고치면 컨테이너 안에 바로 반영된다.
      - ./pipeline:/opt/work
      # s3a 설정을 미리 넣어 둔다 — 코드에서 config 를 쓰지 않아도 된다.
      - ./deploy/local/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./deploy/local/spark/spark-env.sh:/opt/spark/conf/spark-env.sh:ro
      # 내려받은 JAR 캐시. 없으면 실행할 때마다 Maven 에서 다시 받는다.
      - sparkivy:/opt/work/.ivy2
    working_dir: /opt/work
    user: root
    # exec 해서 쓰는 컨테이너다. 계속 떠 있게만 해 둔다.
    #   docker compose exec spark pyspark
    #   docker compose exec spark spark-submit /opt/work/작업파일.py
    command: ["sleep", "infinity"]

  # ── AI 파트 ────────────────────────────────────────────────
  #
  # 유사도 배치. 운영에서는 EC2 #1 의 cron 이 배치 시각마다 새로 띄우는 1회성 잡이라
  # 상시 떠 있지 않는다. spark 처럼 exec 로 쓰는 컨테이너가 아니다.
  #
  # 별도 프로파일에 둔다 — `--profile all` 로 올렸을 때 배치가 같이 돌아
  # NotImplementedError 로 죽는 소음을 막는다. 로컬 용도는 이미지 빌드 확인·단계별 실행이다.
  #
  #   docker compose --profile similarity build similarity
  #   docker compose --profile similarity run --rm --env-file pipeline/minio/.env similarity --help
  #
  # MinIO 가 필요하면 먼저: docker compose --profile data up -d minio
  #
  # env_file 을 여기 고정하지 않는다 — 그러면 그 파일이 없을 때 `build` 까지 막힌다.
  # (배치는 아직 로컬에서 돌지 않으므로 자격증명은 run 시점에 --env-file 로 주입한다)
  similarity:
    profiles: ["similarity"]
    build:
      context: ./ai/similarity

volumes:
  pgdata:
  # minio-data 는 적재한 원본을 담는다. `down -v` 로 지우지 말 것.
  minio-data:
  sparkivy:
