# Pickage 로컬 개발 환경
#
#   docker compose --profile api  up     postgres + api
#   docker compose --profile data up     minio + spark
#   docker compose --profile all  up     전부
#
# 아래 값은 전부 로컬 전용이라 비밀이 아니다. 그래서 커밋되어 있고,
# .env 를 복사하거나 채우는 사전 단계가 없다.
#
# 사용법·함정 모음: deploy/local/README.md

# 프로젝트 이름. 지정하지 않으면 폴더 이름(S15P21A506)이 쓰인다.
# 컨테이너·네트워크·볼륨 이름의 접두사가 되므로 명시해 둔다.
#   pickage-postgres-1 / pickage-api-1 / pickage_default / pickage_pgdata
#
# 주의: 이 이름을 나중에 바꾸면 볼륨 이름도 같이 바뀌어(pickage_pgdata → 새이름_pgdata)
#       기존 데이터가 고아 볼륨으로 남는다. 바꿀 거면 데이터가 없을 때 바꿀 것.
name: pickage

services:
  postgres:
    profiles: ["api", "all"]
    # ↑ 서비스 이름이 곧 컨테이너 네트워크 안의 호스트명이 된다.
    #   그래서 api 컨테이너는 localhost 가 아니라 postgres:5432 로 붙는다.
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pickage
      POSTGRES_DB: pickage
    ports:
      - "15432:5432"
      # 왼쪽 = 내 PC 포트, 오른쪽 = 컨테이너 안 포트.
      # 5432 를 그대로 열지 않는 이유: PC 에 Postgres 를 따로 설치한 사람과 충돌한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 컨테이너 안의 DB 파일 경로를 컨테이너 바깥(named volume)에 둔다.
      # 이게 없으면 컨테이너를 지울 때 데이터도 같이 사라진다.
    healthcheck:
      # "컨테이너가 떴다" 와 "DB 가 연결을 받는다" 는 다르다.
      # compose 는 후자를 스스로 알지 못하므로, 판단하는 방법을 여기서 알려 준다.
      # 아래 api 서비스가 이 판정을 기다린다.
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickage"]
      interval: 5s      # 5초마다 검사
      timeout: 3s       # 3초 안에 answer 없으면 실패로 침
      retries: 10       # 10번 연속 실패하면 unhealthy
      start_period: 10s # 기동 직후 10초는 실패해도 재시도 횟수에 세지 않음

  api:
    profiles: ["api", "all"]
    build:
      context: ./backend
    depends_on:
      postgres:
        # "컨테이너가 떴다" 가 아니라 "DB 가 연결을 받는다" 를 기다린다.
        # 이 조건이 없으면 첫 `up` 이 거의 항상 실패한다.
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 안에서 localhost 는 컨테이너 자신이다. 내 PC 가 아니다.
      # 같은 compose 네트워크 안에서는 서비스 이름(postgres)이 곧 호스트명이고,
      # 포트도 15432 가 아니라 컨테이너 안의 5432 다.
      #
      # application-local.yaml 을 고치지 않는다 —
      # Spring 은 환경변수를 application.yaml 보다 우선하므로 이 줄이 이긴다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pickage
    mem_limit: 1.6g
    # ↑ 운영 서버의 api 컨테이너와 같은 메모리 상한.
    #   32GB PC 에서 멀쩡하던 것이 서버 1.6GB 제한에서 죽는 사고를 로컬에서 미리 잡는다.

  # ── 데이터 파트 ────────────────────────────────────────────────

  minio:
    profiles: ["data", "all"]
    # 운영 서버와 같은 태그. 로컬에서 되는 게 서버에서도 되도록 맞춰 둔다.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      # 로컬 전용 값. 서버 자격증명과 절대 같게 두지 말 것.
      MINIO_ROOT_USER: pickage
      MINIO_ROOT_PASSWORD: pickage123
    ports:
      - "9000:9000"   # S3 API — 코드가 붙는 곳
      - "9001:9001"   # 웹 콘솔 — 브라우저로 확인
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    profiles: ["data", "all"]
    # 버킷을 자동으로 만든다. 한 번 돌고 끝나는 일회성 컨테이너다.
    # 이게 있어서 `up` 한 번이면 버킷까지 준비된 상태가 된다.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 pickage pickage123
        mc mb --ignore-existing local/raw local/curated local/pkg-vectors local/mlflow-artifacts
        echo "── 버킷 준비 완료 ──"
        mc ls local
    restart: "no"

  spark:
    profiles: ["data", "all"]
    image: apache/spark:3.5.3-python3
    depends_on:
      minio-init:
        # 버킷이 만들어진 뒤에 뜬다.
        condition: service_completed_successfully
    volumes:
      # 잡 코드. 호스트에서 고치면 컨테이너 안에 바로 반영된다.
      - ./pipeline:/opt/work
      # s3a 설정을 미리 넣어 둔다 — 팀원이 매번 config 를 쓰지 않아도 된다.
      - ./deploy/local/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      # 내려받은 JAR 캐시. 이게 없으면 실행할 때마다 Maven 에서 다시 받는다.
      - sparkivy:/opt/work/.ivy2
    working_dir: /opt/work
    user: root
    # exec 해서 쓰는 컨테이너다. 계속 떠 있게만 해 둔다.
    #   docker compose exec spark pyspark
    #   docker compose exec spark spark-submit myjob.py
    command: ["sleep", "infinity"]

volumes:
  pgdata:
  miniodata:
  sparkivy:
  # 볼륨은 컨테이너와 수명이 다르다.
  #   docker compose down      → 컨테이너만 지움. 볼륨은 남음 (데이터 유지)
  #   docker compose down -v   → 볼륨까지 지움 (데이터 삭제)
