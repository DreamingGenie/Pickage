name: pickage-local
services:
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file: ./pipeline/minio/.env
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio-init:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./pipeline/minio/.env
    volumes:
      - ./pipeline/minio/init-buckets.sh:/init-buckets.sh:ro
volumes:
  minio-data:
